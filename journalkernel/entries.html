<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal Entries</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/base.css">
</head>

<body class="page-entries">
    <div class="container">
        <div class="header">
            <h1><span class="wm-journal">journal</span> <span class="wm-entries">entries</span></h1>
            <div class="header-actions">
                <a href="./index.html?new=true" class="start-button">Start New Entry</a>
                <a href="./index.html" class="start-button neutral">Back to editor</a>
            </div>
        </div>

        <div class="entries-container" id="entriesContainer">
            <!-- entries.js replaces this with the entry list (or keeps the
                 empty state when there are no entries yet). -->
            <div class="empty-state">
                <h2>No entries yet</h2>
                <p>Start journaling to see your entries here</p>
                <a href="./index.html">Write your first entry</a>
            </div>
        </div>
    </div>

    <script src="./js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="./js/supabase-init.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/util.js"></script>
    <script src="./js/store.js"></script>
    <script src="./js/entries.js"></script>
</body>

</html>
