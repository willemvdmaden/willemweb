<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in · journal kernel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/base.css">
</head>

<body class="page-auth">
    <div class="auth-shell">
        <div class="brand"><span class="wm-journal">journal</span> <span class="wm-kernel">kernel</span></div>
        <div class="tagline">write freely, reflect deeply</div>

        <div class="auth-card">
            <div class="card-header">
                <h1>Welcome back</h1>
                <p>Access is by invitation only.</p>
            </div>

            <div class="flash error" id="authMessage" hidden></div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="field-label" for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email"
                           autocomplete="email" required autofocus>
                </div>

                <div class="form-group">
                    <label class="field-label" for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password"
                           autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn btn-block" id="loginBtn">Log in</button>
            </form>

            <div class="auth-foot">
                <button type="button" class="link-btn" id="forgotBtn">Forgot password?</button>
            </div>
        </div>

        <div class="back-link">
            <a href="https://willemvandermaden.com/">← willemvandermaden.com</a>
        </div>
    </div>

    <script src="./js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="./js/supabase-init.js"></script>
    <script src="./js/auth.js"></script>
</body>

</html>
