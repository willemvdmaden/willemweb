<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set password · journal kernel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/base.css">
</head>

<body class="page-auth">
    <div class="auth-shell">
        <div class="brand"><span class="wm-journal">journal</span> <span class="wm-kernel">kernel</span></div>
        <div class="tagline">write freely, reflect deeply</div>

        <div class="auth-card">
            <div class="card-header">
                <h1>Set your password</h1>
                <p>Choose the password you'll use to log in.</p>
            </div>

            <div class="flash error" id="authMessage" hidden></div>

            <!-- Shown while auth.js consumes the invite/recovery token from
                 the link. Replaced by the form on success, or by the
                 expired-link message on failure. -->
            <p id="authWorking" style="text-align:center; color:#9C968E; font-size:14px;">
                Checking your link&hellip;
            </p>

            <!-- Expired / invalid link state (auth.js unhides this when the
                 URL carries hash error params like error_code=otp_expired). -->
            <div id="linkExpired" hidden>
                <div class="flash info">
                    This link has expired — use <strong>Forgot password</strong> on the
                    login page to get a new one.
                </div>
                <div class="auth-foot">
                    <a class="link-btn" href="./login.html">Go to log in</a>
                </div>
            </div>

            <form id="setPasswordForm" hidden>
                <div class="form-group">
                    <label class="field-label" for="password">New password</label>
                    <input type="password" id="password" name="password" placeholder="At least 8 characters"
                           autocomplete="new-password" minlength="8" required>
                    <div class="field-hint">At least 8 characters.</div>
                </div>

                <div class="form-group">
                    <label class="field-label" for="passwordConfirm">Confirm password</label>
                    <input type="password" id="passwordConfirm" name="passwordConfirm"
                           placeholder="Repeat the password" autocomplete="new-password" minlength="8" required>
                </div>

                <button type="submit" class="btn btn-block" id="setPasswordBtn">Set password</button>
            </form>
        </div>

        <div class="back-link">
            <a href="./login.html">← Back to log in</a>
        </div>
    </div>

    <script src="./js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="./js/supabase-init.js"></script>
    <script src="./js/auth.js"></script>
</body>

</html>
