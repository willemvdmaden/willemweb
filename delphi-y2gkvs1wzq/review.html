<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Pilot review - LLM self-explanations</title>
<style>
/* ---- tokens ---------------------------------------------------- */
:root {
  color-scheme: light dark;

  --bg: #f7f7f5;
  --surface: #ffffff;
  --surface-2: #f0f0ed;
  --surface-3: #e7e7e3;
  --text: #16181c;
  --muted: #575c63;
  --border: #dcdcd7;
  --border-strong: #b3b5b0;

  --accent: #1a4fd0;
  --accent-hover: #143da6;
  --accent-weak: #e9effc;
  --on-accent: #ffffff;
  --focus: #1a4fd0;

  --danger: #a5251c;
  --danger-weak: #fdecea;
  --danger-border: #e0a49e;

  --warn-bg: #fdf5e4;
  --warn-border: #e0c384;
  --warn-text: #6a4c11;

  --seg-1: #dfe3e8;
  --seg-2: #ccd8ea;
  --seg-3: #b6c8e8;
  --seg-4: #93b0e4;
  --seg-5: #6f96de;
  --seg-text: #16181c;

  --radius: 10px;
  --radius-sm: 7px;
  --maxw: 880px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161a;
    --surface: #1b1e24;
    --surface-2: #22262d;
    --surface-3: #2a2f37;
    --text: #e8eaee;
    --muted: #a5adb8;
    --border: #313640;
    --border-strong: #4a515c;

    --accent: #8ab0ff;
    --accent-hover: #a7c3ff;
    --accent-weak: #1d2740;
    --on-accent: #10131a;
    --focus: #8ab0ff;

    --danger: #ff9b92;
    --danger-weak: #3a1f1d;
    --danger-border: #6e3a35;

    --warn-bg: #2e2716;
    --warn-border: #6b5a2c;
    --warn-text: #f0d79a;

    --seg-1: #2f3540;
    --seg-2: #34405a;
    --seg-3: #3a4d74;
    --seg-4: #41598d;
    --seg-5: #4766a6;
    --seg-text: #e8eaee;
  }
}

/* ---- base ------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.wrap {
  max-width: var(--maxw);
  margin-inline: auto;
  padding-inline: 20px;
}

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
  border-radius: 3px;
}

a { color: var(--accent); text-underline-offset: 2px; }
a:hover { color: var(--accent-hover); }

.skip {
  position: absolute;
  left: -9999px;
  top: 0;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border-strong);
  border-radius: 0 0 var(--radius-sm) 0;
  padding: .6rem 1rem;
  z-index: 40;
}
.skip:focus { left: 0; }

.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

/* ---- header / footer -------------------------------------------- */
.site-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  display: flex;
  flex-wrap: wrap;
  gap: .5rem 1.25rem;
  align-items: baseline;
  justify-content: space-between;
  padding-block: .85rem;
}
.brand {
  font-size: .95rem;
  font-weight: 600;
  letter-spacing: .01em;
  color: var(--text);
}
.brand .round-tag,
.brand .pilot-tag {
  display: inline-block;
  margin-left: .55rem;
  padding: .05rem .45rem;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--muted);
  font-size: .75rem;
  font-weight: 500;
  letter-spacing: .02em;
  text-transform: uppercase;
  vertical-align: 1px;
}
.brand .pilot-tag { border-color: var(--warn-border); background: var(--warn-bg); color: var(--warn-text); }
.header-nav a {
  font-size: .9rem;
  font-weight: 500;
  white-space: nowrap;
}

.site-footer {
  margin-top: 3.5rem;
  border-top: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  font-size: .85rem;
}
.site-footer .wrap { padding-block: 1.1rem 1.6rem; }
.site-footer p { margin: .2rem 0; }

/* ---- main / typography ------------------------------------------ */
main { display: block; padding-top: 2rem; padding-bottom: 1rem; }
main:focus { outline: none; }

h1 {
  font-size: 1.6rem;
  line-height: 1.3;
  font-weight: 650;
  letter-spacing: -.01em;
  margin: 0 0 1.5rem;
}
h2 {
  font-size: 1.17rem;
  line-height: 1.35;
  font-weight: 650;
  margin: 0 0 .7rem;
}
h3 {
  font-size: 1.02rem;
  line-height: 1.4;
  font-weight: 650;
  margin: 0 0 .4rem;
}
p { margin: 0 0 1rem; }
main section { margin-bottom: 2.25rem; }
main section > h2:first-child { margin-top: 0; }
ul, ol { margin: 0 0 1rem; padding-left: 1.4rem; }
li { margin-bottom: .3rem; }
strong { font-weight: 650; }
hr { border: 0; border-top: 1px solid var(--border); margin: 2rem 0; }
blockquote {
  margin: 0 0 1rem;
  padding-left: 1rem;
  border-left: 3px solid var(--border-strong);
  color: var(--text);
}
code, kbd, samp { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .92em; }
.lede { font-size: 1.05rem; color: var(--text); }
.working-definition {
  max-width: 40rem;
  margin: 1.25rem auto 1.5rem;
  padding: .9rem 1.25rem;
  text-align: center;
  font-size: 1.05rem;
  font-style: italic;
  border-top: 1px solid var(--border-strong);
  border-bottom: 1px solid var(--border-strong);
}
.muted { color: var(--muted); }
.small { font-size: .88rem; }

/* ---- panels ------------------------------------------------------ */
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.3rem 1.35rem .8rem;
  margin-bottom: 2rem;
}
.panel > :last-child { margin-bottom: .5rem; }
.panel-title {
  font-size: .78rem;
  font-weight: 650;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 .75rem;
}

.notice {
  border: 1px solid var(--border);
  border-left-width: 4px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  padding: .8rem 1rem;
  margin: 0 0 1.25rem;
}
.notice > :last-child { margin-bottom: 0; }
.notice-info { border-left-color: var(--accent); }
.notice-warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-text); }
.notice-error { background: var(--danger-weak); border-color: var(--danger-border); border-left-color: var(--danger); color: var(--danger); }
.notice-title { font-weight: 650; margin: 0 0 .25rem; }

.instruction {
  font-size: 1rem;
  color: var(--text);
  background: var(--accent-weak);
  border-radius: var(--radius-sm);
  padding: .7rem .9rem;
  margin: 0 0 1.5rem;
}

/* ---- items ------------------------------------------------------- */
.item {
  border-top: 1px solid var(--border);
  padding: 1.35rem 0 1.4rem;
}
.item:first-of-type, .item:first-child { border-top: 0; }
.item-wording {
  display: block;
  font-size: 1rem;
  font-weight: 600;
  margin: 0 0 .3rem;
}
.item-helper {
  margin: 0 0 .55rem;
  color: var(--muted);
  font-size: .9rem;
}
.item-hint {
  margin: .4rem 0 0;
  color: var(--muted);
  font-size: .85rem;
}
.req {
  color: var(--muted);
  font-weight: 500;
  font-size: .85rem;
  margin-left: .3rem;
}
.item-error {
  display: none;
  margin: .55rem 0 0;
  color: var(--danger);
  font-size: .88rem;
  font-weight: 600;
}
.item.missing {
  background: var(--danger-weak);
  border-left: 4px solid var(--danger);
  border-radius: var(--radius-sm);
  padding-left: 1rem;
  padding-right: 1rem;
  margin-left: -1rem;
  margin-right: -1rem;
}
.item.missing .item-error { display: block; }

/* ---- likert ------------------------------------------------------ */
.likert-row {
  display: flex;
  align-items: stretch;
  gap: 1.4rem;
  margin-top: .65rem;
}
.likert-scale {
  display: flex;
  flex: 1 1 auto;
  gap: .4rem;
  min-width: 0;
}
.lk-opt,
.lk-cj {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: .35rem;
  text-align: center;
  padding: .6rem .45rem .55rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
  transition: background-color .12s ease, border-color .12s ease;
}
.lk-opt { flex: 1 1 0; min-width: 0; }
.lk-opt:hover { background: var(--accent-weak); border-color: var(--border-strong); }
.lk-opt input, .lk-cj input {
  margin: 0;
  width: 1.1rem;
  height: 1.1rem;
  accent-color: var(--accent);
  cursor: pointer;
}
.lk-num { font-weight: 650; font-size: .95rem; line-height: 1; }
.lk-txt { font-size: .82rem; line-height: 1.25; color: var(--muted); }
.lk-opt:has(input:checked) {
  background: var(--accent-weak);
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}
.lk-opt:has(input:checked) .lk-txt { color: var(--text); }

/* Cannot judge: own surface, own border, a real gap, never the accent. */
.likert-cj {
  display: flex;
  flex: 0 0 auto;
  align-items: stretch;
  padding-left: 1.4rem;
  border-left: 1px dashed var(--border-strong);
}
.lk-cj {
  width: 9.5rem;
  background: var(--surface-2);
  border: 1px dashed var(--border-strong);
  justify-content: center;
}
.lk-cj input { accent-color: var(--muted); }
.lk-cj .lk-txt { color: var(--muted); font-size: .85rem; font-weight: 600; }
.lk-cj:hover { background: var(--surface-3); }
.lk-cj:has(input:checked) {
  background: var(--surface-3);
  border-style: solid;
  border-color: var(--border-strong);
  box-shadow: inset 0 0 0 1px var(--border-strong);
}
.lk-cj:has(input:checked) .lk-txt { color: var(--text); }

@media (max-width: 760px) {
  .likert-row { flex-direction: column; gap: .8rem; }
  .likert-scale { flex-direction: column; gap: .35rem; }
  .lk-opt {
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    text-align: left;
    gap: .6rem;
    padding: .55rem .7rem;
  }
  .lk-opt .lk-txt { font-size: .92rem; }
  .likert-cj {
    padding-left: 0;
    padding-top: .8rem;
    border-left: 0;
    border-top: 1px dashed var(--border-strong);
  }
  .lk-cj {
    width: 100%;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    gap: .6rem;
    padding: .55rem .7rem;
  }
  .lk-cj .lk-txt { font-size: .92rem; }
}

/* ---- select-all (Q2) --------------------------------------------- */
.checklist {
  margin: .7rem 0 0;
  padding: 0;
  list-style: none;
  columns: 1;
  column-gap: 2.2rem;
}
@media (min-width: 700px) { .checklist { columns: 2; } }
.checklist li {
  margin: 0 0 .15rem;
  break-inside: avoid;
  -webkit-column-break-inside: avoid;
}
.check {
  display: flex;
  align-items: flex-start;
  gap: .6rem;
  padding: .3rem .45rem;
  border-radius: var(--radius-sm);
  cursor: pointer;
  line-height: 1.45;
}
.check:hover { background: var(--surface-2); }
.check input {
  margin: .25rem 0 0;
  width: 1.05rem;
  height: 1.05rem;
  flex: 0 0 auto;
  accent-color: var(--accent);
  cursor: pointer;
}
.check-text { font-size: .95rem; }
.check-other { margin-top: .9rem; padding-top: .8rem; border-top: 1px solid var(--border); }
.other-box { margin: .45rem 0 0 1.65rem; }
.other-box input[type="text"] { max-width: 34rem; }

/* ---- text inputs ------------------------------------------------- */
textarea,
input[type="text"],
input[type="email"],
input[type="password"],
input[type="number"],
input[type="search"],
select {
  width: 100%;
  font: inherit;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  padding: .55rem .7rem;
}
textarea { line-height: 1.55; resize: vertical; min-height: 4.5rem; }
textarea:focus, input:focus, select:focus { border-color: var(--accent); }
::placeholder { color: var(--muted); opacity: .8; }

fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0; }
label { cursor: pointer; }

.choices { list-style: none; margin: .6rem 0 0; padding: 0; }
.choices li { margin-bottom: .15rem; }

/* ---- buttons ----------------------------------------------------- */
.btn,
button,
input[type="submit"] {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .5rem;
  font: inherit;
  font-weight: 600;
  line-height: 1.2;
  padding: .7rem 1.35rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--on-accent);
  cursor: pointer;
  text-decoration: none;
}
.btn:hover,
button:hover,
input[type="submit"]:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--on-accent); }
.btn[disabled],
button[disabled],
input[type="submit"][disabled] {
  background: var(--surface-3);
  border-color: var(--border);
  color: var(--muted);
  cursor: not-allowed;
}
.btn-secondary,
button.btn-secondary {
  background: var(--surface);
  color: var(--accent);
  border-color: var(--border-strong);
}
.btn-secondary:hover,
button.btn-secondary:hover { background: var(--surface-2); color: var(--accent-hover); border-color: var(--border-strong); }
.btn-quiet,
button.btn-quiet {
  background: transparent;
  color: var(--muted);
  border-color: transparent;
  padding-inline: .6rem;
  font-weight: 500;
}
.btn-quiet:hover,
button.btn-quiet:hover { background: var(--surface-2); color: var(--text); border-color: transparent; }
.btn-danger,
button.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-danger:hover,
button.btn-danger:hover { filter: brightness(1.08); background: var(--danger); border-color: var(--danger); }

.actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .85rem;
  margin: 2rem 0 1rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--border);
}
.gate-hint { color: var(--muted); font-size: .88rem; }
.save-status { margin: .5rem 0 0; font-size: .88rem; color: var(--muted); }
.save-status-warn { color: var(--danger); font-weight: 600; }

/* ---- progress ---------------------------------------------------- */
.progress-bar { background: var(--surface); border-bottom: 1px solid var(--border); }
.progress-bar .wrap { padding-block: .7rem .8rem; }
.progress-track {
  height: 7px;
  border-radius: 999px;
  background: var(--surface-3);
  overflow: hidden;
}
.progress-fill { height: 100%; background: var(--accent); border-radius: 999px; }
.progress-label {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  margin: .4rem 0 0;
  font-size: .82rem;
  color: var(--muted);
}
.progress-label strong { color: var(--text); font-weight: 600; }

/* ---- example pair ------------------------------------------------ */
.pair { margin: 0 0 2rem; }
.pair-details {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  padding: .3rem .9rem;
  margin: 0 0 2rem;
}
.pair-details > summary {
  cursor: pointer;
  font-weight: 600;
  font-size: .95rem;
  padding: .6rem .1rem;
  list-style-position: outside;
}
.pair-details[open] > summary { border-bottom: 1px solid var(--border); margin-bottom: .9rem; }
.pair-details .pair { margin-bottom: .9rem; }

/* conditional reason boxes (change list, item 4): hidden only when JS runs. */
.js .cond:not(.cond-open) { display: none; }
.cond { margin: -.25rem 0 1.25rem; padding: .75rem 1rem; border-left: 3px solid var(--accent); background: var(--surface-2, var(--surface)); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.cond .item { margin-bottom: 0; }
.no-js .cond .item-wording::after { content: " (only if you rated it 3 or lower)"; font-weight: 400; color: var(--muted); }

/* subdimension accordion (change list, item 2) */
.acc-heading { font-size: 1.15rem; margin: 2rem 0 .75rem; }
details.acc { border: 1px solid var(--border); border-radius: var(--radius); margin: 0 0 .75rem; background: var(--surface); }
details.acc > summary { cursor: pointer; padding: .8rem 1rem; list-style: none; display: flex; flex-wrap: wrap; gap: .25rem .75rem; align-items: baseline; }
details.acc > summary::-webkit-details-marker { display: none; }
details.acc > summary::before { content: "▸"; display: inline-block; width: 1rem; color: var(--muted); }
details.acc[open] > summary::before { content: "▾"; }
details.acc > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius); }
.acc-name { font-weight: 600; }
.acc-def { color: var(--muted); font-size: .92rem; flex: 1 1 18rem; }
.acc-body { padding: 0 1rem 1rem; border-top: 1px solid var(--border); }
.acc-body .subblock { border: 0; padding: 0; margin-top: .75rem; }

/* ================================================================
   v1.2 survey UI spec: 15px base, white, 860px, no cards, a rating grid.
   Appended last so it overrides the base rules above.
   ================================================================ */
html { color-scheme: light; }
:root { --bg: #ffffff; --surface: #ffffff; --surface-2: #f6f6f6; --surface-3: #efefef; --maxw: 860px; --radius: 4px; --radius-sm: 3px; --border: #e3e3e3; --muted: #6b6b6b; }
@media (prefers-color-scheme: dark) {
  :root, :root:not([data-theme="light"]), :root[data-theme="dark"] {
    --bg: #ffffff; --surface: #ffffff; --surface-2: #f6f6f6; --surface-3: #efefef; --text: #16181c; --muted: #6b6b6b;
    --border: #e3e3e3; --border-strong: #b9b9b9; --accent: #1a4fd0; --accent-hover: #143da6; --accent-weak: #eef2fc; --on-accent: #fff; --focus: #1a4fd0;
    --danger: #a5251c; --danger-weak: #fdecea; --danger-border: #e0a49e; --warn-bg: #fdf5e4; --warn-border: #e0c384; --warn-text: #6a4c11;
    --seg-1: #dfe3e8; --seg-2: #ccd8ea; --seg-3: #b6c8e8; --seg-4: #93b0e4; --seg-5: #6f96de; --seg-text: #16181c;
  }
}
body { font-size: 15px; line-height: 1.4; background: #fff; }
h1, h2 { font-size: 20px; line-height: 1.3; font-weight: 600; margin: 24px 0 8px; }
h3 { font-size: 16px; line-height: 1.3; font-weight: 600; margin: 28px 0 8px; }
.item-helper, .small, .muted, .lede { font-size: 13px; color: var(--muted); }
.lede { font-size: 15px; color: var(--text); }
.req { display: none; }
.topline { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; color: var(--muted); padding: 12px 0 10px; border-bottom: 1px solid var(--border); }
/* spec 06: the progress line and its reference link stay in view while the page scrolls */
.topline { position: sticky; top: 0; z-index: 40; background: #fff; }
.topline .header-nav { display: flex; gap: 16px; }
.topline a { color: var(--muted); }
.topline .round-tag, .topline .pilot-tag, .topline .dev-tag { margin-left: 8px; }
main.wrap { padding-top: 8px; }
/* the annotated pair */
.pair-grid { gap: 16px; }
.pair-card { border: 0; padding: 0; background: transparent; }
.pair-cap { font-variant: all-small-caps; letter-spacing: .04em; font-size: 14px; color: var(--muted); text-align: center; margin-top: 6px; }
/* definition block */
.def-name { margin-top: 24px; }
.def-text { margin: 0 0 12px; }
.def-note { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
.sub-heading { margin-top: 28px; }
/* rating grid */
.lg { margin: 4px 0 8px; }
.lg-head, .lg-row { display: flex; align-items: center; }
.lg-head { min-height: 22px; }
.lg-row { min-height: 40px; border-bottom: 1px solid var(--border); margin: 0; padding: 2px 0; }
.lg-stmt { flex: 0 0 45%; margin: 0; padding-right: 12px; font-size: 15px; font-weight: 400; }
.lg-help { display: block; font-size: 13px; color: var(--muted); }
.lg-opts { margin-left: auto; display: grid; grid-template-columns: repeat(5, 40px) 24px 40px; align-items: end; }
.lg-opt { grid-column: auto; display: flex; flex-direction: column; align-items: center; cursor: pointer; margin: 0; }
.lg-opt.lg-cj { grid-column: 7; }
.lg-opt input { width: 20px; height: 20px; margin: 0; accent-color: #333; }
.lg-num { font-size: 12px; color: #888; line-height: 1; height: 12px; margin-top: 2px; }
/* All three header labels on one row, bottom-aligned, over their own columns:
   "Strongly disagree" starts over point 1, "Strongly agree" ends over point 5,
   "Cannot judge" sits over its own button. Non-overlapping spans, pinned to
   row 1, so the grid can never push one of them onto a second line. */
.lg-lab {
  grid-row: 1; width: 64px; justify-self: center; text-align: center;
  font-size: 11px; line-height: 1.15; color: #888; white-space: normal;
  padding-bottom: 6px; align-self: end;
}
.lg-lab-l { grid-column: 1; }
.lg-lab-r { grid-column: 5; }
.lg-lab-cj { grid-column: 7; }
.lg-row.missing { background: var(--danger-weak); box-shadow: inset 3px 0 0 var(--danger); }
.lg-row .item-error { display: none; }
/* subdimension blocks */
.sd { margin: 0 0 22px; }
.sd-name { margin: 0; font-size: 15px; }
.sd-chars { color: var(--muted); font-weight: 400; }
.sd-def { margin: 2px 0 6px; }
/* inline reason box */
.cond { margin: 0 0 10px; padding: 8px 0 2px; border-left: 0; background: transparent; border-radius: 0; }
.text-compact .item-wording { font-size: 13px; color: var(--muted); font-weight: 400; margin-bottom: 4px; }
.text-compact textarea { min-height: 3.2em; }
/* candidate checklist */
.select-item .checklist { columns: 1; column-count: 1; display: block; }
.select-item .checklist li { margin: 0; padding: 6px 0; border-bottom: 1px solid var(--border); }
.select-item fieldset { border: 0; padding: 0; }
.select-item legend:empty { display: none; }
/* the briefing figure (stimuli v2.4) */
.briefing-figure { margin: 16px 0 20px; }
.briefing-figure img { display: block; width: 100%; height: auto; max-width: 760px; margin: 0 auto; border: 1px solid var(--border); border-radius: 8px; }

/* the briefing's worked example, styled like the annotated stimulus cards:
   one assistant message, the response and the explanation shaded in place
   with a small tag after each, in the cards' blue / amber annotation colours. */
.anatomy { margin: 16px 0 20px; }
.anatomy-card { border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; background: #fff; box-shadow: 0 0 0 8px #f3f4f6; margin: 8px; }
.anatomy-user { max-width: 75%; margin: 0 0 16px auto; padding: 10px 14px; background: #e5e7eb; border-radius: 12px; font-size: 14px; line-height: 1.45; }
.anatomy-reply { display: flex; gap: 10px; align-items: flex-start; }
.anatomy-avatar { flex: 0 0 22px; width: 22px; height: 22px; border-radius: 50%; background: #1f2328; display: inline-flex; align-items: center; justify-content: center; margin-top: 1px; }
.anatomy-msg { flex: 1 1 auto; min-width: 0; font-size: 14px; line-height: 1.5; }
.anatomy-msg p { margin: 0 0 6px; }
.anatomy-msg ul { margin: 0 0 6px; padding-left: 20px; }
.anatomy-msg li { margin: 0 0 2px; }
mark.span-response { background: #fef3c7; color: inherit; padding: 1px 2px; border-bottom: 3px solid #b45309; }
.span-explanation { background: #dbeafe; border-bottom: 3px solid #1d4ed8; padding: 6px 8px 2px; margin: 4px 0 0; }
.span-explanation p:last-child { margin-bottom: 4px; }
.span-tag { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; font-size: 11px; line-height: 1.5; vertical-align: 1px; font-weight: 600; }
.tag-response { background: #fef3c7; color: #b45309; border: 1px solid #f5d88a; }
.tag-explanation { background: #fff; color: #1d4ed8; border: 1px solid #bfd3f7; }
.anatomy figcaption { font-size: 13px; color: var(--muted); margin: 10px 8px 0; }

/* the review page */
.review-table { width: 100%; border-collapse: collapse; margin: 4px 0 8px; }
.review-table th, .review-table td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); font-size: 15px; vertical-align: top; }
.review-table thead th { font-size: 12px; color: #888; font-weight: 400; border-bottom-color: #ccc; }
.review-table tr.review-dim th { font-weight: 600; padding-top: 16px; border-bottom-color: #ccc; }
.review-table tr.missing td { background: var(--danger-weak); }
.review-table td:last-child { text-align: right; white-space: nowrap; }
.review-pages { list-style: none; padding: 0; margin: 0 0 8px; }
.review-pages li { padding: 8px 6px; border-bottom: 1px solid var(--border); }
.review-pages li.missing { background: var(--danger-weak); }
/* actions right-aligned */
.actions { display: flex; flex-direction: row-reverse; justify-content: flex-start; gap: 12px; margin-top: 24px; }
.actions .gate-hint { margin-right: auto; font-size: 13px; color: var(--danger); }
@media (max-width: 700px) {
  .lg-head, .lg-row { flex-wrap: wrap; }
  .lg-stmt { flex: 1 1 100%; padding: 4px 0; }
  .lg-opts { margin-left: 0; }
}

/* dev session: deliberately loud, so it is never mistaken for a real run. */
.dev-banner {
  background: #7a2d12;
  color: #fff6ee;
  border-bottom: 2px solid #f0a06a;
  font-size: .9rem;
}
.dev-banner-inner {
  display: flex; flex-wrap: wrap; align-items: center; gap: .6rem .9rem;
  padding: .55rem 0;
}
.dev-banner-label {
  font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
  font-size: .72rem; background: #f0a06a; color: #4a1b09;
  padding: .12rem .45rem; border-radius: 3px; white-space: nowrap;
}
.dev-banner-text { flex: 1 1 22rem; min-width: 0; }
.dev-jump { display: flex; align-items: center; gap: .4rem; margin-left: auto; }
.dev-jump label { font-size: .8rem; opacity: .9; }
.dev-jump select {
  font: inherit; font-size: .82rem; padding: .18rem .3rem; max-width: 15rem;
  border-radius: 4px; border: 1px solid #f0a06a; background: #fff6ee; color: #4a1b09;
}
.dev-tag {
  display: inline-block; margin-left: .45rem; padding: .05rem .4rem;
  font-size: .68rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .05em; border-radius: 3px;
  background: #7a2d12; color: #fff6ee;
}
.btn-sm { padding: .2rem .55rem; font-size: .8rem; }
@media (max-width: 700px) { .dev-jump { margin-left: 0; } }

.pair-grid { display: flex; gap: 1rem; align-items: flex-start; }
.pair-card {
  flex: 1 1 0;
  min-width: 0;
  margin: 0;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #ffffff;
  padding: .5rem;
  overflow: hidden;
}
.pair-open { display: block; line-height: 0; border-radius: var(--radius-sm); }
.pair-card img { display: block; width: 100%; height: auto; border-radius: 4px; }

@media (max-width: 899px) {
  .pair-grid { flex-direction: column; }
  /* spec 4.8: A above B, whatever the left/right randomization was. */
  .pair-card[data-variant="A"] { order: 1; }
  .pair-card[data-variant="B"] { order: 2; }
  /*
   * "flex: 1 1 0" above sets a flex-basis of 0 on the MAIN axis. Once the grid
   * becomes a column that main axis is the height, and in an auto-height
   * container there is no free space to grow into, so both cards resolved to
   * roughly zero height and "overflow: hidden" clipped the images away
   * entirely: on a phone the example pair was invisible. Back to content
   * height here (spec 4.8).
   */
  .pair-card { width: 100%; flex: 0 0 auto; }
}

.lightbox {
  border: 0;
  padding: 0;
  max-width: 96vw;
  max-height: 96vh;
  background: transparent;
  color: var(--text);
  overflow: visible;
}
.lightbox::backdrop { background: rgba(8, 10, 14, .72); }
.lightbox-inner {
  background: #ffffff;
  border-radius: var(--radius);
  padding: .5rem;
  max-height: 96vh;
  overflow: auto;
}
.lightbox-bar { display: flex; justify-content: flex-end; }
.lightbox img { display: block; max-width: 100%; height: auto; }

/* ---- taxonomy tables and blocks ---------------------------------- */
.table-wrap { overflow-x: auto; margin: 0 0 1.2rem; }
table.tax-table {
  border-collapse: collapse;
  width: 100%;
  font-size: .93rem;
  min-width: 34rem;
}
table.tax-table caption { text-align: left; color: var(--muted); font-size: .85rem; padding-bottom: .4rem; }
table.tax-table th, table.tax-table td {
  text-align: left;
  vertical-align: top;
  padding: .55rem .7rem;
  border-bottom: 1px solid var(--border);
}
table.tax-table thead th {
  font-size: .75rem;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 1px solid var(--border-strong);
  white-space: nowrap;
}
table.tax-table tbody tr:last-child th,
table.tax-table tbody tr:last-child td { border-bottom: 0; }
table.tax-table .col-num { width: 2.2rem; color: var(--muted); }
table.tax-table .col-name { font-weight: 600; white-space: nowrap; }

.chips { list-style: none; display: flex; flex-wrap: wrap; gap: .35rem; margin: 0; padding: 0; }
.chips li {
  margin: 0;
  font-size: .82rem;
  line-height: 1.35;
  color: var(--text);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: .12rem .6rem;
}

.subblock {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  padding: 1.1rem 1.2rem;
  margin: 0 0 .9rem;
}
.subblock-head { display: flex; align-items: baseline; gap: .55rem; flex-wrap: wrap; }
.subblock-num { color: var(--muted); font-size: .85rem; font-weight: 600; }
.subblock-def { margin: .35rem 0 .6rem; }
.subblock-chars { margin: 0; }
.subblock-chars .chips-label {
  display: block;
  font-size: .75rem;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: .3rem;
}

/* ---- round 2 results row ----------------------------------------- */
.results {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: .8rem .9rem .7rem;
  margin: .7rem 0 1rem;
}
.results-title {
  font-size: .75rem;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 .5rem;
}
.dist {
  display: flex;
  width: 100%;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: var(--surface);
}
.dist-seg {
  flex-basis: 0;
  min-width: 2.4rem;
  padding: .3rem .2rem;
  text-align: center;
  font-size: .85rem;
  font-weight: 650;
  color: var(--seg-text);
  border-right: 1px solid var(--surface);
}
.dist-seg:last-child { border-right: 0; }
.dist-seg[data-point="1"] { background: var(--seg-1); }
.dist-seg[data-point="2"] { background: var(--seg-2); }
.dist-seg[data-point="3"] { background: var(--seg-3); }
.dist-seg[data-point="4"] { background: var(--seg-4); }
.dist-seg[data-point="5"] { background: var(--seg-5); }
.dist-empty { padding: .3rem .5rem; color: var(--muted); font-size: .85rem; }
.dist-key {
  display: flex;
  flex-wrap: wrap;
  gap: .25rem .9rem;
  list-style: none;
  margin: .45rem 0 0;
  padding: 0;
  font-size: .78rem;
  color: var(--muted);
}
.dist-key li { display: flex; align-items: center; gap: .3rem; margin: 0; }
.dist-key i {
  display: inline-block;
  width: .7rem;
  height: .7rem;
  border-radius: 2px;
  border: 1px solid var(--border-strong);
}
.dist-key li[data-point="1"] i { background: var(--seg-1); }
.dist-key li[data-point="2"] i { background: var(--seg-2); }
.dist-key li[data-point="3"] i { background: var(--seg-3); }
.dist-key li[data-point="4"] i { background: var(--seg-4); }
.dist-key li[data-point="5"] i { background: var(--seg-5); }
.results-meta { margin: .55rem 0 0; font-size: .88rem; color: var(--muted); }
.results-meta strong { color: var(--text); font-weight: 600; }
.results-meta .sep { padding: 0 .45rem; }

/* ---- round 2 per-item extras ------------------------------------- */
.own-answer, .r2-block { margin: .6rem 0 1rem; font-size: .95rem; }
.r2-label {
  display: block;
  font-size: .75rem;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: .2rem;
}
.tag-updated {
  display: inline-block;
  margin-left: .45rem;
  padding: .05rem .45rem;
  border-radius: 999px;
  background: var(--accent-weak);
  border: 1px solid var(--accent);
  color: var(--accent);
  font-size: .72rem;
  font-weight: 650;
  text-transform: uppercase;
  letter-spacing: .04em;
  vertical-align: 1px;
}

/* ---- v1.3: the wide pair and the edge dock ----------------------- */
/* The pair breaks out of the 860px text column and uses the screen width, so
   the cards are readable without opening them. Negative margin, not a
   transform, so it never creates horizontal scroll. */
.pair.pair-wide {
  width: min(calc(100vw - 48px), 1760px);
  margin-left: calc(50% - min(calc(50vw - 24px), 880px));
  margin-bottom: 28px;
}
.pair.pair-wide .pair-grid { gap: 24px; align-items: flex-start; }
.pair.pair-wide .pair-card { border: 1px solid var(--border); border-radius: 8px; padding: 10px; background: #fff; overflow: visible; }
.pair.pair-wide .pair-card img { width: 100%; height: auto; }
.pair.pair-wide .pair-open { cursor: zoom-in; }

/* Once the pair has scrolled out of view, each card docks as a tab on its own
   screen edge (left card left, right card right). A tab slides its card out
   as a drawer; both can be open at once to compare. Built by pairDockJs(). */
.pdock { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
.pdock-side {
  position: absolute; top: 0; bottom: 0; width: min(46vw, 860px);
  transition: transform .3s cubic-bezier(.2, .7, .2, 1);
}
.pdock-left { left: 0; transform: translateX(-100%); }
.pdock-right { right: 0; transform: translateX(100%); }
.pdock-side.is-open { transform: translateX(0); }
.pdock:not(.is-shown) .pdock-left { transform: translateX(calc(-100% - 72px)); }
.pdock:not(.is-shown) .pdock-right { transform: translateX(calc(100% + 72px)); }
.pdock-panel {
  pointer-events: auto; position: absolute; inset: 0; background: #fff;
  display: flex; flex-direction: column; outline: none;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .08), 0 18px 48px rgba(0, 0, 0, .22);
}
.pdock-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  font-variant: all-small-caps; letter-spacing: .05em; font-size: 15px; color: var(--muted);
}
.pdock-close { font: inherit; font-size: 20px; line-height: 1; background: none; border: 0; cursor: pointer; color: var(--text); padding: 2px 6px; border-radius: 4px; font-variant: normal; }
.pdock-close:hover { background: #f0f0f0; }
.pdock-body { flex: 1 1 auto; overflow-y: auto; padding: 14px; overscroll-behavior: contain; }
.pdock-body img { display: block; width: 100%; height: auto; }
.pdock-tab {
  pointer-events: auto; position: absolute; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 14px 9px; background: #fff; color: var(--text);
  border: 1px solid var(--border); cursor: pointer;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .14);
  font: 600 13px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.pdock-left .pdock-tab { left: 100%; border-left: 0; border-radius: 0 10px 10px 0; }
.pdock-right .pdock-tab { right: 100%; border-right: 0; border-radius: 10px 0 0 10px; }
.pdock-tab-letter { font-size: 18px; }
.pdock-tab-word { writing-mode: vertical-rl; letter-spacing: .08em; font-weight: 500; font-size: 12px; color: var(--muted); }
.pdock-left .pdock-tab-word { transform: rotate(180deg); }
.pdock-tab:hover { background: #f6f7f9; }
.pdock-tab:focus-visible, .pdock-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pdock-side.is-open .pdock-tab { background: #f1f4fb; }
@media (max-width: 700px) { .pdock-side { width: min(88vw, 860px); } }
.pdock-ghost {
  position: fixed; z-index: 59; pointer-events: none; overflow: hidden;
  transform-origin: 0 0; background: #fff; border: 1px solid var(--border);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .18);
}
.pdock-ghost img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 100%; display: block; }
@keyframes pdock-pulse { 0% { box-shadow: 0 0 0 0 rgba(26, 79, 208, .45); } 100% { box-shadow: 0 0 0 14px rgba(26, 79, 208, 0); } }
.pdock-tab.pdock-pulse { animation: pdock-pulse .9s ease-out 2; }
.pdock-hint {
  position: fixed; z-index: 61; left: 50%; bottom: 24px; transform: translateX(-50%);
  max-width: min(92vw, 520px); padding: 10px 16px; border-radius: 8px;
  background: #1f2328; color: #fff; font-size: 14px; line-height: 1.35; text-align: center;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .25); transition: opacity .6s ease;
}
.pdock-hint.is-gone { opacity: 0; }
@media (prefers-reduced-motion: reduce) { .pdock-side { transition: none; } }

/* subdimension blocks: name, definition, the values it can take */
.sub-lead { margin: 0 0 16px; font-size: 13px; color: var(--muted); }
.sd-def { margin: 2px 0 2px; }
p.sd-chars { margin: 0 0 6px; font-size: 13px; color: var(--muted); }
.sd-chars-label { font-weight: 600; color: var(--text); margin-right: 2px; }

/* closing page: the taxonomy at a glance */
.tax-overview { margin: 12px 0 8px; padding: 14px 0 10px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.tax-overview-title { margin: 0 0 10px; font-weight: 600; }
.tax-overview-title span { font-weight: 400; font-size: 13px; color: var(--muted); margin-left: 6px; }
.tax-overview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px 28px; margin: 0; }
.tax-dim dt { font-weight: 600; font-size: 14px; }
.tax-dim dd { margin: 1px 0 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
.tax-overview-foot { margin: 10px 0 0; font-size: 13px; color: var(--muted); }

/* closing page: plain lead, attribution, references */
.closing-lead { margin: 0 0 8px; }
.refs { margin: 28px 0 0; padding: 12px 0 0 1.4em; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
.refs li { margin: 0 0 6px; padding-left: 2px; }
.refs a { color: var(--muted); text-decoration: none; }
sup.fn { font-size: 11px; font-weight: 500; margin-left: 2px; }
sup.fn a { color: var(--accent); text-decoration: none; }

/* the dimension page title and subtitle */
.dim-head { margin: 18px 0 16px; }
.dim-head .dim-title { font-size: 20px; margin: 0 0 4px; }
.dim-head .dim-subs { margin: 0; font-size: 15px; color: var(--muted); }

/* ---- print ------------------------------------------------------- */
@media print {
  .pdock { display: none !important; }
  body { background: #fff; color: #000; font-size: 11pt; }
  .site-header, .site-footer, .progress-bar, .skip, .actions, .lightbox { display: none !important; }
  main { padding-top: 0; }
  .panel, .subblock, .pair-card { border-color: #999; break-inside: avoid; }
  a { color: #000; text-decoration: underline; }
}
.rv { max-width: 860px; margin: 0 auto; padding: 0 16px 64px; }
.rv h1 { font-size: 20px; margin: 24px 0 6px; }
.rv .intro { color: var(--muted); max-width: 70ch; }
.rv .tools { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 14px 0 6px; font-size: 13px; color: var(--muted); }
.rv .tools label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; color: var(--text); }
.rv section.sec { margin-top: 32px; }
.rv section.sec > h2 { font-size: 17px; margin: 0 0 2px; }
.rv section.sec > p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
.rv .card { border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; margin: 0 0 12px; display: grid; gap: 10px; background: #fff; }
.rv .card.mine { border-left: 4px solid #2b6cb0; }
.rv .card h3 { font-size: 15px; margin: 0; }
.rv .diff { display: grid; gap: 6px; font-size: 14px; }
.rv .diff .lbl { font-size: 12px; font-weight: 600; color: var(--muted); }
.rv .diff .old { text-decoration: line-through; color: #8a3b36; }
.rv .diff .new { color: #1d6b3d; }
.rv .diff .row { display: grid; gap: 1px; }
.rv .diff .row b { font-size: 12px; font-weight: 600; color: var(--muted); }
.rv .why { font-size: 14px; }
.rv .why b, .rv .said b { font-size: 12px; color: var(--muted); }
.rv .said { display: grid; gap: 6px; font-size: 14px; }
.rv .mine-text { background: #eef4fb; border-radius: 4px; padding: 6px 10px; white-space: pre-line; }
.rv .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.rv .chip { position: relative; }
.rv .chip > button { font: inherit; font-size: 13px; border: 1px solid var(--border); border-radius: 999px; background: #fff; color: var(--text); padding: 2px 10px; cursor: pointer; min-height: 0; box-shadow: none; }
.rv .chip > button[aria-expanded="true"] { background: #eef4fb; border-color: #2b6cb0; }
.rv .pop { display: none; position: absolute; z-index: 20; left: 0; top: calc(100% + 6px); width: min(26rem, 80vw); background: #fff; border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.14); padding: 8px 10px; font-size: 13px; white-space: pre-line; }
.rv .chip.open .pop { display: block; }
.rv .answer { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; border-top: 1px solid var(--border); padding-top: 10px; }
.rv .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.rv .seg button { font: inherit; font-size: 14px; border: 0; border-radius: 0; background: #fff; color: var(--text); padding: 5px 14px; cursor: pointer; min-height: 0; box-shadow: none; }
.rv .seg button + button { border-left: 1px solid var(--border); }
.rv .seg button[aria-pressed="true"].c0 { background: #e4f3ea; color: #1d6b3d; font-weight: 600; }
.rv .seg button[aria-pressed="true"].c1 { background: #f8e4e2; color: #8a3b36; font-weight: 600; }
.rv textarea { font: inherit; font-size: 14px; width: 100%; min-height: 2.4rem; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; }
.rv .final { margin-top: 36px; border-top: 2px solid var(--border); padding-top: 16px; display: grid; gap: 10px; }
.rv .status { font-size: 13px; color: var(--muted); }
.rv .err { color: #8a3b36; }
.rv [hidden] { display: none !important; }
</style>
