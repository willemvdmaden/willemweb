<script>
(function () {
  var DATA = {"sections":[{"key":"taxonomy","title":"Changes to the taxonomy","note":"Applied in the revised survey. Old wording is struck through, new wording follows.","choices":["Accept","Decline"]},{"key":"pairs","title":"Planned changes to the example pairs","note":"Not drawn yet. The example images are redone once these are agreed.","choices":["Accept","Decline"]},{"key":"survey","title":"Changes to the survey","note":"Applied in the revised survey.","choices":["Accept","Decline"]},{"key":"experts","title":"Suggestions left to the expert round","note":"Structural questions the expert panel exists to judge. We propose to leave the taxonomy as it is here and let the experts decide.","choices":["Leave to experts","Change it now"]},{"key":"kept","title":"Comments we did not act on","note":"Each with the reason. Tell us if you disagree.","choices":["Fine","Disagree"]}],"items":[{"id":"t01","section":"taxonomy","title":"Provenance in plain words","why":"The old definition made \"post hoc\" true of every self-explanation, and its words were hard to follow. The new one names the actual difference: reasoning written before the answer, or a justification written after it.","old":"","change":"","diff":[{"label":"Provenance (Source)","rows":[{"field":"Definition","old":"How the explanation relates to the process that produced the answer","now":"Whether the explanation is the reasoning produced before the answer, or a justification written after it"},{"field":"Characteristics","old":"from reasoning trace, post hoc, post hoc and verified","now":"reasoning produced before the answer, justification written after the answer, justification written after and checked against the reasoning"}]}],"comments":[{"key":"Jichen:D6_S1_Q12","who":"Jichen","text":"\"post hoc\" caught my attention here --- every self-explanation is post hoc, isn't it? In addition, I couldn't tell the difference between the examples in var A & B."},{"key":"Wendy:D6_S1_Q12","who":"Wendy","text":"A bit hard to understand - mostly because there are many specialized technical words in the definition: provenance, \"relates to the process that produces the answer\", reasoning trace, etc. Perhaps it could be reformatted a bit with easier-to-understand wording, which would help people who are not extremely familiar with these terms."},{"key":"Emil:D6_Q15","who":"Emil","text":"Maybe \"How the explanation relates to the process that produced the answer\" could be reformulated as in the dimension description \"whether the shown reasons come from the process that produced the answer or were generated afterward\""}]},{"id":"t02","section":"taxonomy","title":"Register and Warmth made independent","why":"Both shared \"neutral\" and read as one scale. Register is now only how formal the language is; Warmth is only whether the text expresses care. Whether to merge them is left to the experts (below).","old":"","change":"","diff":[{"label":"Register (Interpersonal stance)","rows":[{"field":"Definition","old":"Formality toward the user","now":"How formal the language is"}]},{"label":"Warmth (Interpersonal stance)","rows":[{"field":"Definition","old":"Affective stance toward the user","now":"Whether the text expresses care for the user (empathy, praise, reassurance)"},{"field":"Characteristics","old":"warm, neutral (no affective cues)","now":"warm, none"}]}],"comments":[{"key":"Wendy:D3_S2_Q12","who":"Wendy","text":"I think the subdimensions \"Register\" and \"Warmth\" are closely related and could overlap. Both, for example, have \"neutral\" as an example. And for me, formal is one end of the spectrum, neutral is in the middle, and warm/casual is on the other end. In my mind, I would refer to both subdimensions as \"tone of voice\""},{"key":"Wendy:D3_S3_Q12","who":"Wendy","text":"I think the subdimensions \"Register\" and \"Warmth\" are closely related and could overlap. Both, for example, have \"neutral\" as an example. And for me, formal is one end of the spectrum, neutral is in the middle, and warm/casual is on the other end. In my mind, I would refer to both subdimensions as \"tone of voice\""},{"key":"Pelin:D3_S3_Q12","who":"Pelin","text":"Warmth and register sound similar, although I understand they are different. Maybe better definitions?"},{"key":"Emil:D3_S2_Q12","who":"Emil","text":"I feel Framing (if includes the tool voice) Register and Warmth have an overlapping/intersection"},{"key":"Emil:D3_S3_Q12","who":"Emil","text":"Maybe could be reframed as \"Whether and how the explanation directs emotional or relational cues at the user\". I had to search what 'stance' mean and maybe 'approach' or 'attituted' is a more know one?\nI feel Framing (if includes the tool voice) Register and Warmth have an overlapping/intersection"}]},{"id":"t03","section":"taxonomy","title":"Tailoring moved to Interpersonal stance","why":"Tailoring is about the relation to the user, not about what the explanation claims. Semantic loses \"for whom\"; Interpersonal stance gains Tailoring as its last subdimension.","old":"","change":"","diff":[{"label":"Tailoring to the user (Interpersonal stance)","rows":[{"field":"Dimension","old":"Semantic","now":"Interpersonal stance"}]},{"label":"Semantic (dimension)","rows":[{"field":"Definition","old":"Semantic covers what the explanation claims and for whom: whether the reasons are true and support the answer, whether the explanation and the answer agree, and whether the explanation is adapted to the user.","now":"Semantic covers what the explanation claims: whether its reasons are correct and support the answer, and whether the explanation agrees with the answer."},{"field":"Subdimensions","old":"Correctness of reasoning, Consistency with answer, Tailoring to the user","now":"Correctness of reasoning, Consistency with answer"}]},{"label":"Interpersonal stance (dimension)","rows":[{"field":"Definition","old":"Interpersonal stance covers how the explanation positions the system toward the user: who is presented as doing the reasoning, how formal and how warm the address is, whether the system sides with what the user brought to the interaction, and whether it uses rhetorical devices beyond stating reasons.","now":"Interpersonal stance covers how the explanation positions the system toward the user: who is presented as doing the reasoning, how formal and how warm the address is, whether the system sides with what the user brought to the interaction, whether it uses rhetorical devices beyond stating reasons, and whether it is adapted to what the system knows about the user."},{"field":"Subdimensions","old":"Framing, Register, Warmth, Agreement with user's position, Persuasive appeals","now":"Framing, Register, Warmth, Agreement with user's position, Persuasive appeals, Tailoring to the user"}]}],"comments":[{"key":"Wendy:D7_LOW","who":"Wendy","text":"I think the \"for whom\" part of the definition is a different question and a bit out of scope for me; it's a bit confusing. It would be clearer if the \"Dimension: Semantic\" focused on the explanation's claim, its truthfulness, reasoning, and support for the answer. The \"for whom\" part, I think, is more for the \"Dimension: Interpersonal\"\n\n- This \"Dimension: Semantic\" for me is also very related/might overlap with both \"Dimension: Epistemic stance\" (also about claims, reasoning, how sure it is) and \"Dimension: Structural\" (that also deals with claims, reasoning, one path/multiple paths). Variation A, for example, could also be about the dimensions: Structural, Semantic, and Epistemic. \n\nI almost feel like the dimensions Semantic and Epistemic stance could be combined. This may be because both terms are related linguistically and philosophically, and it is hard to separate a semantic issue from an epistemic one, especially for AI explanations."},{"key":"Emil:D7_LOW","who":"Emil","text":"\"for whom\" I don't see how.. and it looks a bit of pragmatic instead of Semantic, maybe could be reformulated as \"and wether the content is tailored to the user\".. also being tailored is a part of the semantic?"},{"key":"Pelin:D7_Q15","who":"Pelin","text":"It is not clear to me why tailoring is part of semantics. Secondly unclear to me why an incorrect reasoning would be a design decision"},{"key":"Jichen:D7_LOW","who":"Jichen","text":"- The term \"Semantics\" is very broad, covering anything related to the meaning of explanations. The three sub-dimensions seem to point to the quality of the explanations. Perhaps it's worth rethinking how we name this category?"}]},{"id":"t04","section":"taxonomy","title":"Correctness and Consistency sharpened","why":"Correctness now concerns whether the reasons are factually right (\"true\" was ambiguous); Consistency concerns whether the explanation agrees with its own answer. Merging them is not proposed: an explanation can be correct and still contradict its answer.","old":"","change":"","diff":[{"label":"Correctness of reasoning (Semantic)","rows":[{"field":"Definition","old":"Whether the stated reasons are true and support the answer","now":"Whether the stated reasons are factually correct and support the answer"}]},{"label":"Consistency with answer (Semantic)","rows":[{"field":"Definition","old":"Whether the explanation and the answer agree","now":"Whether the explanation agrees with the answer it accompanies or contradicts it"}]}],"comments":[{"key":"Wendy:D7_S1_Q12","who":"Wendy","text":"I think \"Correctness of reasoning\" and \"Consistency with answer\" are closely related and may overlap."},{"key":"Wendy:D7_S2_Q12","who":"Wendy","text":"I think \"Correctness of reasoning\" and \"Consistency with answer\" are closely related and may overlap."},{"key":"Wendy:D7_Q15","who":"Wendy","text":"I would merge the first two subdimensions."},{"key":"Jichen:D7_Q8","who":"Jichen","text":"- correctness of reasoning: Whether the stated reasons are true and support the answer. The word \"true\" here is a bit unclear. True as in it matches the model's underlying process (i.e., fidelity)? Perhaps you only care about  whether the explanations \"support the answer\"? If so, I'd remove \" are true\"\n- Consistency with answer -> Consistency with the answer the explanations are about. (See below about shaded phrase)\n- Tailoring to the user: \"Whether the explanation is adapted to what the system knows about the user\" -> \"Whether the explanation HIGHLIGHTS THAT IT IS adapted to what the system knows about the user\". The reason is that sometimes an explanation is implicitly personalized. Unless the explanation highlights that, it is hard to know."}]},{"id":"t05","section":"taxonomy","title":"\"No position stated\" added to Agreement","why":"Users often ask without taking a position, as in the example. Every explanation must still fall into exactly one characteristic.","old":"","change":"","diff":[{"label":"Agreement with user's position (Interpersonal stance)","rows":[{"field":"Characteristics","old":"challenges, neutral, accommodates, actively affirms","now":"no position stated, challenges, neutral, accommodates, actively affirms"}]}],"comments":[{"key":"Jichen:D3_S4_Q12","who":"Jichen","text":"I'm not sure that users always come with a position. IN this example, the user asks the LLM a question, without necessarily having a position."},{"key":"Emil:D3_Q15","who":"Emil","text":"Maybe \"Stance toward the premise or view the user brought\" could be reframed as \"Attitude toward the view/position of the user\""}]},{"id":"t06","section":"taxonomy","title":"Hedging separated from Expressed confidence","why":"Expressed confidence is about the conclusion; Hedging is about individual reasons. The definition now says so. Disclaimer stays separate: it is a statement of limits, not a softened reason.","old":"","change":"","diff":[{"label":"Hedging (Epistemic stance)","rows":[{"field":"Definition","old":"Whether individual reasons carry mitigating words (appears to, possibly, seems)","now":"Whether individual reasons, not the conclusion, are softened (appears to, possibly, seems)"}]}],"comments":[{"key":"Jichen:D2_S3_Q12","who":"Jichen","text":"Hedging seems very related to \"Expressed confidence\". Some clarification of the differences would be super helpful - or merge them?"},{"key":"Jichen:D2_S4_Q12","who":"Jichen","text":"Also seems related to \"hedging\"?"}]},{"id":"t07","section":"taxonomy","title":"Confidence granularity renamed Confidence scope","why":"The old name was hard to read; the definition now says what it means.","old":"","change":"","diff":[{"label":"Confidence scope (Epistemic stance)","rows":[{"field":"Name","old":"Confidence granularity","now":"Confidence scope"},{"field":"Definition","old":"The level at which confidence is attached","now":"Whether confidence is stated for the whole answer, for individual claims, or both"}]}],"comments":[{"key":"Emil:D2_Q15","who":"Emil","text":"Maybe \"The level at which confidence is attached\" could be formulated as \"Whether the confidence is attached to the whole answer or to individual claims\" or \"The unit that each confidence estimate refers to\" or \"The scope of each confidence estimate\""},{"key":"Jichen:D2_Q15","who":"Jichen","text":"\"confidence granularity\" sounds a bit odd. But I don't think I understand it enough to suggest alternatives."}]},{"id":"t08","section":"taxonomy","title":"Framing characteristics with examples","why":"It was unclear what \"tool voice\" and \"user-directed\" mean; each characteristic now carries a short example.","old":"","change":"","diff":[{"label":"Framing (Interpersonal stance)","rows":[{"field":"Characteristics","old":"first person, impersonal, tool voice, user-directed","now":"first person (I checked), impersonal (The domain is…), tool voice (The scan found…), user-directed (You can see…)"}]}],"comments":[{"key":"Pelin:D3_S1_Q12","who":"Pelin","text":"Characteristics are rather unclear. Are they examples, or categories? In the examples as well, user-directed is still reading as first-person..."},{"key":"Emil:D3_S1_Q12","who":"Emil","text":"I think this could really benefit a reformulation but I'm not sure how. Maybe \"The person in which the explanation is written\" but then the 'tool voice' would be lost, what about maybe here it is kinda exiting the boundaries and entering the territory of the Register and Warmth.. Or maybe I'm just not understanding tool voice"},{"key":"Emil:D3_Q8","who":"Emil","text":"See above. Maybe reformulating Framing as \"The person in which the explanation is written\" and \"Formality toward the user\" as \"Language formality\" (taking out the specific reference to the interpersonal relationship, conserving it implicitly) would leave the space for all of them (like in the example given)"},{"key":"Jichen:D3_Q15","who":"Jichen","text":"Some renaming suggestions: Feel free to ignore any or all of these\n- \"framing\" could be \"perspective\"? -> AI's perspective, user's perspective\n- \"warmth\" could be \"affective tone\"? \"validating\"?\n- \"agreement\", \"persuasive appeals\" (see my comments above)\nperhaps we could benefit from someone who has expertise in linguistics or rhetoric to look at these taxonomy"}]},{"id":"t09","section":"taxonomy","title":"Trace form defined in plain words","why":"\"Trace\" was not defined. Trace form is how much of the reasoning is shown; where the explanation comes from is Provenance.","old":"","change":"","diff":[{"label":"Trace form (Reasoning structure)","rows":[{"field":"Dimension","old":"Structural","now":"Reasoning structure"},{"field":"Definition","old":"How much of the reasoning process is shown","now":"How much of the step-by-step reasoning that produced the answer is shown"}]}],"comments":[{"key":"Jichen:D4_S5_Q12","who":"Jichen","text":"Similar as before, given the probabilistic nature of LLMs, how we can know what is \"full trace\"? (Also, the word trace could be defined... Personally I don't know what precise it is)"},{"key":"Pelin:D4_S5_Q12","who":"Pelin","text":"Trace form looks similar to Provenance, at least in the example"}]},{"id":"t10","section":"taxonomy","title":"Reasoning form reworded","why":"\"The path of the reasoning\" was unclear.","old":"","change":"","diff":[{"label":"Reasoning form (Reasoning structure)","rows":[{"field":"Dimension","old":"Structural","now":"Reasoning structure"},{"field":"Definition","old":"The path of the reasoning","now":"Whether the reasoning follows one line or weighs alternatives"}]}],"comments":[{"key":"Emil:D4_Q15","who":"Emil","text":"I think \"The path of the reasoning\" could be formulated as \"Whether it follows one path or weighs alternatives\" (taking the sentence structure from Completeness) and \"Whether the explanation says why this rather than an alternative\" could be formulated as \"Whether the explanation accounts for why this outcome occurred and not another\" or \"Whether the explanation addresses the counterfactual, i.e. why not the alternative.\"\n\nIt is not very important tho, that is why I kept 4 and not 3"},{"key":"Jichen:D4_S1_Q12","who":"Jichen","text":"I struggle a bit to understand what \"linear\" and \"branching\" refer to in the two examples.  I'm also not sure about the term \"path of reasoning\" here..."}]},{"id":"t11","section":"taxonomy","title":"Vocabulary says what \"specialized\" means","why":"It was unclear what counts as specialized.","old":"","change":"","diff":[{"label":"Vocabulary (Surface)","rows":[{"field":"Definition","old":"How specialized the words are","now":"How much domain-specific terminology (jargon) the words use"}]}],"comments":[{"key":"Jichen:D1_S2_Q12","who":"Jichen","text":"A few things that are unclear to me: \n- what constitutes as \"specialized\"? Jargon? \n- how do you define \"mostly\"? \n- This subdimension seems to overlap a bit with \"tone\" or \"register\" from some of the previous dimensions, at least just looking at the terminologies themselves."}]},{"id":"t12","section":"taxonomy","title":"Progressive disclosure separated from Availability","why":"Availability is whether the explanation is shown at all by default; Progressive disclosure is whether, once shown, more can be opened in steps.","old":"","change":"","diff":[{"label":"Progressive disclosure (Delivery)","rows":[{"field":"Definition","old":"Whether more detail can be revealed in steps","now":"Once shown, whether more detail can be opened in steps"}]}],"comments":[{"key":"Jichen:D5_S3_Q12","who":"Jichen","text":"I am not sure I can tell the difference between \"progressive disclosure\" and \"on request\"."},{"key":"Emil:D5_Q8","who":"Emil","text":"I guess \"Timing\" could be equally reframed as \"Placing\" and then it would become a bit blurry between Delivery and Surface. \n\"Progressive disclosure\" isn't it a sub-subdimension of \"Interactivity\"?"}]},{"id":"t13","section":"taxonomy","title":"Modality: \"medium\" instead of \"channel\"","why":"\"Channel\" was ambiguous.","old":"","change":"","diff":[{"label":"Modality (Delivery)","rows":[{"field":"Definition","old":"The channel of the explanation","now":"The medium through which the explanation is delivered"}]}],"comments":[{"key":"Emil:D5_Q15","who":"Emil","text":"Maybe \"The channel of the explanation\" should be formulated as \"The form in which the explanation is presented\" or \"The medium through which the explanation is delivered\" (channel is an ambiguous word). Also maybe \"What the user can do with the shown reasoning\" could be formulated as \"How far the user can go beyond reading the explanation\" or \"The actions the interface offers on the explanation\""}]},{"id":"t14","section":"taxonomy","title":"Structural renamed Reasoning structure","why":"The label \"Structural\" did not say what the dimension holds; all five subdimensions concern the form of the reasoning.","old":"","change":"","diff":[{"label":"Reasoning structure (dimension)","rows":[{"field":"Name","old":"Structural","now":"Reasoning structure"},{"field":"Definition","old":"Structural covers the form of the reasoning as it appears on the page: whether it follows one path or weighs alternatives, whether every claim gets a reason, whether it says why this rather than something else, where the conclusion sits, and how much of the reasoning process is shown.","now":"Reasoning structure covers the form of the reasoning as it appears on the page: whether it follows one path or weighs alternatives, whether every claim gets a reason, whether it says why this rather than something else, where the conclusion sits, and how much of the reasoning process is shown."}]}],"comments":[{"key":"Jichen:D4_LOW","who":"Jichen","text":"I am a bit confused about the label \"structural\" and the subdimensions it contains."},{"key":"Jichen:D4_Q8","who":"Jichen","text":"Hmmm....  The connection between the subdimensions is slightly unclear to me. Some explanations of how you picked these specific ones could be helpful."}]},{"id":"e01","section":"pairs","title":"Interpersonal stance: a clear Register contrast","why":"Both variations read as casual.","old":"","change":"Variation A clearly neutral or formal, Variation B clearly casual.","diff":[],"comments":[{"key":"Jichen:D3_Q16","who":"Jichen","text":"Register: I don't perceive a big difference between the two variations. I might call both casual."}]},{"id":"e02","section":"pairs","title":"Interpersonal stance: user-directed Framing throughout","why":"User-directed still read as first person.","old":"","change":"The variant addresses the reasoning to the user (\"You can see…\") throughout.","diff":[],"comments":[{"key":"Pelin:D3_S1_Q12","who":"Pelin","text":"Characteristics are rather unclear. Are they examples, or categories? In the examples as well, user-directed is still reading as first-person..."}]},{"id":"e03","section":"pairs","title":"Source: Provenance visible","why":"The two examples looked the same.","old":"","change":"A visible cue, for example a \"Reasoned for 8 seconds\" trace before the answer versus a \"Why?\" justification written afterwards.","diff":[],"comments":[{"key":"Jichen:D6_S1_Q12","who":"Jichen","text":"\"post hoc\" caught my attention here --- every self-explanation is post hoc, isn't it? In addition, I couldn't tell the difference between the examples in var A & B."}]},{"id":"e04","section":"pairs","title":"Epistemic stance: confidence for the whole answer","why":"Response-level confidence was not visible in Variation B.","old":"","change":"Variation B gets one statement of confidence about the whole answer, so \"both\" is visible.","diff":[],"comments":[{"key":"Jichen:D2_S2_Q12","who":"Jichen","text":"I am having trouble seeing the response-level confidence granularity in Variation B..."}]},{"id":"e05","section":"pairs","title":"Delivery: progressive disclosure and multimodal","why":"Progressive disclosure could not be told from \"on request\", and it was unclear why Variation B is multimodal.","old":"","change":"An expandable second level inside the opened explanation, and the confidence bar marked as the visual part.","diff":[],"comments":[{"key":"Jichen:D5_S3_Q12","who":"Jichen","text":"I am not sure I can tell the difference between \"progressive disclosure\" and \"on request\"."},{"key":"Jichen:D5_Q16","who":"Jichen","text":"I'm not sure on how Var B is multi-model."}]},{"id":"e06","section":"pairs","title":"Reasoning structure: branching and completeness visible","why":"Linear and branching were hard to see, and why Variation A counts as partial was unclear.","old":"","change":"The variant explicitly weighs a second reading before concluding, and the claim without a stated reason is marked.","diff":[],"comments":[{"key":"Jichen:D4_S1_Q12","who":"Jichen","text":"I struggle a bit to understand what \"linear\" and \"branching\" refer to in the two examples.  I'm also not sure about the term \"path of reasoning\" here..."},{"key":"Jichen:D4_S2_Q12","who":"Jichen","text":"I would rate \"4\" based on the definition. However, I do not understand why Variation A is considered \"partial\" completion. Is it because it only lists 2 out of 3 reasons? But how would you (as designer/dev) know what is complete, since self-explanation may generate different answers each time?"}]},{"id":"e07","section":"pairs","title":"Semantic: contradict the classification itself","why":"The contradiction was with the recommended action, and the Correctness marks differed between the two examples.","old":"","change":"The variant’s explanation contradicts \"phishing\" itself, and Correctness is marked on the same reasons in both examples. Tailoring moves to the Interpersonal stance pair.","diff":[],"comments":[{"key":"Jichen:D7_Q16","who":"Jichen","text":"- Correctness (blue) in var A contains 1 reason and var B includes all 3. Should it be consistent?\n- consistency (yellow): I see the contradiction in var A. But in both cases, these are NOT the ML decision being explained (i.e., this is a phishing email). As I see it, to click or not to click is the action the LLM suggests based on that phishing decision."}]},{"id":"s01","section":"survey","title":"Time estimate: about an hour","why":"The pilot took about 63 to 175 minutes (long idle visits not counted).","old":"About 25 to 30 minutes.","change":"About an hour; you can pause and come back with your link.","diff":[],"comments":[]},{"id":"s02","section":"survey","title":"The taxonomy is open to extension","why":"This only became clear late, from one closing question.","old":"","change":"Briefing: \"The taxonomy is not meant to be complete: if a property is missing, please tell us.\"","diff":[],"comments":[{"key":"Jichen:Z_10","who":"Jichen","text":"Overall thought: I had an aha moment when one question said \"this taxonomy\" is meant to be expandable. It's worth telling people up front that these dimensions and subdimensions are not meant to be complete (or am I wrong?)"}]},{"id":"s03","section":"survey","title":"Some properties cannot be seen in the text","why":"Provenance, Trace form and Correctness were hard to judge from the examples alone.","old":"","change":"Briefing: \"Some properties, such as where an explanation comes from, cannot be seen in the text itself; the labels at the top of each example say which characteristic it has.\"","diff":[],"comments":[{"key":"Pelin:D4_S4_Q12","who":"Pelin","text":"Again, a bit confusing with \"Provenance\""}]},{"id":"s04","section":"survey","title":"Consensus needs a median of at least agree","why":"Four ratings of \"neither\" sit close together and counted as consensus. On the pilot data the stricter rule leaves out exactly the five weakest items.","old":"At least 70% agree, or an IQR of at most one point.","change":"At least 70% agree, or an IQR of at most one point with a median of at least 4.","diff":[],"comments":[]},{"id":"s05","section":"survey","title":"Optional boxes can stay empty","why":"Many optional boxes held \"No\" or \"No further comment\".","old":"","change":"Under each optional comment box: \"Optional. Leave empty if you have nothing to add.\"","diff":[],"comments":[]},{"id":"x01","section":"experts","title":"Merge Semantic with Epistemic stance","why":"Both concern the claim, which makes them hard to tell apart when classifying. The revised definitions separate them (what is claimed versus how sure it sounds); whether that holds is the experts’ call.","old":"","change":"","diff":[],"comments":[{"key":"Wendy:D2_LOW","who":"Wendy","text":"I think the Dimensions \"Semantic\" and \"Epistemic stance\" are closely related, since both concern the claim and how AI explanations present their reasoning to the user. But the difference is that semantic seems to concern how \"true\"/correct the reasoning is, while epistemic stance concerns how confident the explanation sounds."},{"key":"Wendy:D2_Q8","who":"Wendy","text":"I would consider merging this dimension with the \"Semantic\" dimension."},{"key":"Wendy:D7_Q8","who":"Wendy","text":"I would merge this dimension with the Dimension Epistemic Stance"},{"key":"Wendy:Z_1_LOW","who":"Wendy","text":"I agree mostly, except as I've explained, I think the dimensions \"Semantic\" and \"Epistemic stance\" are very related and may overlap, and it is not clear to me what would fit in one but not the other."},{"key":"Wendy:Z_7_LOW","who":"Wendy","text":"If I were to \"tag\" different LLM explanations as belonging to different dimensions, I would struggle to distinguish between Structural, Semantic, and Epistemic stances. \n\nThis is because all three deal with the claim and its reasoning. \n- Structural has the subdimension \"reasoning form\"\n- Semantic has the subdimension \"Correctness of reasoning\"\n- Epistemic stance has \"expressed confidence\"\n\nFor example: To be able to classify a self-explanation between these three, I first need to very carefully read the claim, break down the reasoning (Structural: \"reasoning form\"), and reason myself on whether the claim is true/correct or not (Semantic: \"Correctness of reasoning\" and \"consistency with answer\"), and based on that decide if the LLM presents it in an appropriate tone of voice (Epistemic Stance: \"expressed confidence\").\n\nAs you can see, that would require me to traverse all three dimensions. It is possible, but it requires more thinking and reasoning than I'd probably like to invest. This is not the case with the other 4 dimensions, which are clearly different."}]},{"id":"x02","section":"experts","title":"Merge Register and Warmth into \"tone of voice\"","why":"Formality and care can vary independently (a formal text can be warm), so they are kept apart with sharper definitions for now.","old":"","change":"","diff":[],"comments":[{"key":"Wendy:D3_Q15","who":"Wendy","text":"I would merge the subdimensions \"Register\" and \"Warmth\" into a single dimension, \"tone of voice,\" or something similar. Where there could be different levels/aspects such as: formal/professional, neutral, warm/friendly/casual"},{"key":"Jichen:D7_Q15","who":"Jichen","text":"Other related semantic subdimensions to consider (feel free to ignore): tone of the voice, perspective (first person vs third person),"}]},{"id":"x03","section":"experts","title":"Make the taxonomy smaller","why":"Seven dimensions and 28 subdimensions is a lot to learn. Which to merge is what the expert ratings of \"belongs\" and \"clearly different\" are for.","old":"","change":"","diff":[],"comments":[{"key":"Jichen:Z_1_LOW","who":"Jichen","text":"I am split on this --- 7 dimensions and 28 subdimensions seem a lot. I am not sure whether they cannot be further consolidated (some suggests are in prev pages). Additional thoughts - \"Source\" could be merged under \"epistemic stance.\""},{"key":"Pelin:Z_1_LOW","who":"Pelin","text":"It is definitely comprehensive, but not, per se, concise, in my opinion. It would take a lot of time to familiarize ourselves, as it is very detailed"}]},{"id":"x04","section":"experts","title":"Rename Epistemic stance to Confidence","why":"The dimension also holds Hedging and Disclaimer, which are not confidence as such.","old":"","change":"","diff":[],"comments":[{"key":"Jichen:D2_Q8","who":"Jichen","text":"“Epistemic stance\" might be a bit abstract here. Have you considered \"confidence\"?"}]},{"id":"x05","section":"experts","title":"Move Detail to Reasoning structure","why":"Detail is about how much support each reason gets, which is visible before reading closely; the experts can judge whether it belongs to Surface.","old":"","change":"","diff":[],"comments":[{"key":"Emil:D1_Q8","who":"Emil","text":"Detail can be hard to actually code before the reading the content I think, and if it requires to read the content then it could be move to Structural as well..."}]},{"id":"x06","section":"experts","title":"Delivery and Surface: rename or redraw the line","why":"Surface is what the text looks like; Delivery is when and how the interface presents it. The experts’ distinctness ratings will show whether the line holds.","old":"","change":"","diff":[],"comments":[{"key":"Jichen:D5_LOW","who":"Jichen","text":"\"Delivery\" seems to be quite related to \"Surface\" - Perhaps you could name this \"Interactivity\"?"},{"key":"Emil:D5_Q8","who":"Emil","text":"I guess \"Timing\" could be equally reframed as \"Placing\" and then it would become a bit blurry between Delivery and Surface. \n\"Progressive disclosure\" isn't it a sub-subdimension of \"Interactivity\"?"}]},{"id":"k01","section":"kept","title":"Length thresholds stay fixed","why":"Fixed sentence counts keep coding the same across studies; what counts as long for a given decision is left to the study that uses the taxonomy.","old":"","change":"","diff":[],"comments":[{"key":"Jichen:D1_Q15","who":"Jichen","text":"- length: the definition is clear. What is long/medium/short can be contextual, depending on the decision being explained. So the hard limit on the number of sentences could be relaxed. \n-"}]},{"id":"k02","section":"kept","title":"Formatting does not mention \"layout\"","why":"\"Layout\" would pull in the interface around the text, which is Delivery.","old":"","change":"","diff":[],"comments":[{"key":"Emil:D1_Q15","who":"Emil","text":"\"The typographic structure of the text\" maybe could benefit of adding the word \"layout\""}]},{"id":"k03","section":"kept","title":"A standing product disclaimer is not a Disclaimer","why":"A fixed line under every answer (\"AI can make mistakes\") is part of the interface, not of this explanation. Disclaimer counts statements inside the explanation.","old":"","change":"","diff":[],"comments":[{"key":"Emil:D2_Q8","who":"Emil","text":"Isn't Disclaimer mandatory? Like \"Claude is an AI and can do mistake. Check the answers yourself\".. Or that doesn't count as explanation?"}]},{"id":"k04","section":"kept","title":"Persuasive appeals stays","why":"It covers rhetorical devices beyond stating reasons (authority, social proof, urgency, emotion), which Register and Warmth do not. Its distinctness is rated by the experts.","old":"","change":"","diff":[],"comments":[{"key":"Pelin:D2_Q8","who":"Pelin","text":"I wonder if some would coincide with \"Persuasive appeals\""},{"key":"Jichen:D3_S5_Q12","who":"Jichen","text":"Persuasive rhetoric can overlap with a mix of many things, such as \"register,\" \"warmth,\" \"persuasive appeals,\" possibly more just in this dimension. It seems to work at a higher level of abstraction than some of the other subdimensions here. A simpler solution is to just remove it to avoid the overlap, but maybe there are smarter solutions"}]},{"id":"k05","section":"kept","title":"Why these subdimensions","why":"Each comes from properties manipulated in prior studies (the position paper); the paper will say so per subdimension. Whether any are missing is a question in the expert round.","old":"","change":"","diff":[],"comments":[{"key":"Jichen:D3_Q8","who":"Jichen","text":"I like the name of this dimension. The 5 subdimensions are individually good, but I am missing why these particular 5. Could there be others? Are there existing linguistic/rhetoric theories and taxonomies that we can lean into?"}]},{"id":"k06","section":"kept","title":"General remarks","why":"Thank you.","old":"","change":"","diff":[],"comments":[{"key":"Wendy:Z_10","who":"Wendy","text":"Overall, I think the dimensions and subdimensions are very useful for describing the characteristics of LLM self-explanations. The examples are also very good for explaining AI explanations."}]}],"people":[{"hash":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","first":"Jichen","role":"coauthor"},{"hash":"4e41ddadd843ce14602ff0ef6c1ef91ac6fb88205958a0961b949cb70c4e7c75","first":"Wendy","role":"coauthor"},{"hash":"c523f2438da8f7906a70f121986d505049f2b461f1ede434cfca3214c3d1eb21","first":"Pelin","role":"coauthor"},{"hash":"b368c90d801cd0f8acb8f839f64469e6017478624433dbc38d8cfdb7d894029c","first":"Emil","role":"coauthor"},{"hash":"85083eda715832fd9d892af603864a168153f0d43e191b5c11476dd09e81a176","first":"Willem","role":"overview"}]};
  var ENDPOINT = "https://delphi-collector.vercel.app/api/answers";
  var TOKEN = (location.search.match(/[?&]t=([A-Za-z0-9_-]{16,64})(?:&|$)/) || [])[1] || null;
  var KEY = 'delphi-review-' + (TOKEN || 'none');
  var d = document, state = { answers: {}, overall: '', submittedAt: null }, me = null;
  try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && s.answers) state = s; } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function el(tag, cls, text) { var n = d.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

  var timer = null;
  function send(kind) {
    if (!ENDPOINT || !TOKEN) return Promise.reject(new Error('no address'));
    var body = JSON.stringify({ v: 1, token: TOKEN, kind: kind, page: 'pilot-review', state: { review: state, who: me && me.first } });
    return fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body })
      .then(function (r) { return r.json(); }).then(function (j) { if (!j || !j.ok) throw new Error((j && j.error) || 'not saved'); return j; });
  }
  function changed() { save(); progress(); clearTimeout(timer); timer = setTimeout(function () { send('progress').catch(function () {}); }, 800); }

  function progress() {
    var total = DATA.items.length, n = DATA.items.filter(function (it) { return state.answers[it.id] && state.answers[it.id].choice != null; }).length;
    d.getElementById('progress').textContent = n + ' of ' + total + ' answered';
  }

  // One entry per person: their comments on this item, exact repeats dropped.
  function byPerson(list) {
    var out = [];
    list.forEach(function (x) {
      var p = out.filter(function (o) { return o.who === x.who; })[0];
      if (!p) { p = { who: x.who, texts: [] }; out.push(p); }
      if (p.texts.indexOf(x.text) === -1) p.texts.push(x.text);
    });
    return out.map(function (p) { return { who: p.who, text: p.texts.join('\n\n') }; });
  }
  function chip(c) {
    var w = el('span', 'chip'), b = el('button', null, c.who); b.type = 'button'; b.setAttribute('aria-expanded', 'false');
    var pop = el('span', 'pop', c.text);
    function set(open) { w.classList.toggle('open', open); b.setAttribute('aria-expanded', String(open)); }
    var pinned = false;
    b.addEventListener('click', function () { pinned = !pinned; set(pinned); });
    w.addEventListener('mouseenter', function () { set(true); });
    w.addEventListener('mouseleave', function () { if (!pinned) set(false); });
    w.append(b, pop);
    return w;
  }

  function card(it, sec) {
    var c = el('article', 'card'); c.id = it.id;
    var mine = me.role === 'coauthor' && it.comments.some(function (x) { return x.who === me.first; });
    if (mine) c.classList.add('mine');
    c.dataset.mine = mine ? '1' : '';
    c.append(el('h3', null, it.title));
    if (it.diff.length || it.old || it.change) {
      var df = el('div', 'diff');
      it.diff.forEach(function (t) {
        df.append(el('div', 'lbl', t.label));
        t.rows.forEach(function (r) {
          var row = el('div', 'row'); row.append(el('b', null, r.field));
          if (r.old) row.append(el('span', 'old', r.old));
          row.append(el('span', 'new', r.now));
          df.append(row);
        });
      });
      if (it.old) { var r1 = el('div', 'row'); r1.append(el('b', null, 'Was'), el('span', 'old', it.old)); df.append(r1); }
      if (it.change) { var r2 = el('div', 'row'); r2.append(el('b', null, it.old ? 'Now' : 'Change'), el('span', 'new', it.change)); df.append(r2); }
      c.append(df);
    }
    if (it.why) { var w = el('div', 'why'); w.append(el('b', null, sec.key === 'kept' || sec.key === 'experts' ? 'Why ' : 'Why: '), d.createTextNode(it.why)); c.append(w); }
    if (it.comments.length) {
      var said = el('div', 'said');
      if (me.role === 'coauthor') {
        var own = byPerson(it.comments.filter(function (x) { return x.who === me.first; }));
        var others = byPerson(it.comments.filter(function (x) { return x.who !== me.first; }));
        if (own.length) { said.append(el('b', null, 'You said')); own.forEach(function (x) { said.append(el('div', 'mine-text', x.text)); }); }
        if (others.length) { var ch = el('div', 'chips'); ch.append(el('b', null, own.length ? 'Others said' : 'Comments')); others.forEach(function (x) { ch.append(chip(x)); }); said.append(ch); }
      } else {
        var ch2 = el('div', 'chips'); ch2.append(el('b', null, 'Comments')); byPerson(it.comments).forEach(function (x) { ch2.append(chip(x)); }); said.append(ch2);
      }
      c.append(said);
    }
    var a = state.answers[it.id] || {};
    var ans = el('div', 'answer'), seg = el('div', 'seg');
    sec.choices.forEach(function (label, i) {
      var b = el('button', 'c' + i, label); b.type = 'button'; b.setAttribute('aria-pressed', String(a.choice === i));
      b.addEventListener('click', function () {
        var cur = state.answers[it.id] || {};
        cur.choice = cur.choice === i ? null : i; cur.label = cur.choice == null ? null : label;
        state.answers[it.id] = cur;
        seg.querySelectorAll('button').forEach(function (x, j) { x.setAttribute('aria-pressed', String(cur.choice === j)); });
        changed();
      });
      seg.append(b);
    });
    var note = el('textarea'); note.rows = 1; note.placeholder = 'Note (optional)'; note.setAttribute('aria-label', 'Note on ' + it.title); note.value = a.note || '';
    note.addEventListener('change', function () { var cur = state.answers[it.id] || {}; cur.note = note.value.trim(); state.answers[it.id] = cur; changed(); });
    ans.append(seg);
    c.append(ans, note);
    return c;
  }

  function render() {
    var box = d.getElementById('sections');
    DATA.sections.forEach(function (sec) {
      var list = DATA.items.filter(function (it) { return it.section === sec.key; });
      if (!list.length) return;
      var s = el('section', 'sec'); s.append(el('h2', null, sec.title), el('p', null, sec.note));
      list.forEach(function (it) { s.append(card(it, sec)); });
      box.append(s);
    });
    var only = d.getElementById('mine-only');
    only.addEventListener('change', function () {
      d.querySelectorAll('.card').forEach(function (c) { c.hidden = only.checked && !c.dataset.mine; });
      d.querySelectorAll('section.sec').forEach(function (s) { s.hidden = !s.querySelector('.card:not([hidden])'); });
    });
    var overall = d.getElementById('overall'); overall.value = state.overall || '';
    overall.addEventListener('change', function () { state.overall = overall.value.trim(); changed(); });
    var sent = d.getElementById('sent');
    if (state.submittedAt) sent.textContent = 'Sent. You can still change answers and send again.';
    d.getElementById('submit').addEventListener('click', function () {
      var btn = this; btn.disabled = true; sent.classList.remove('err'); sent.textContent = 'Sending…';
      state.submittedAt = new Date().toISOString(); save();
      send('complete').then(function () { sent.textContent = 'Sent. Thank you. You can still change answers and send again.'; })
        .catch(function () { sent.classList.add('err'); sent.textContent = 'Not sent. Your answers are kept in this browser; check your connection and try again.'; })
        .then(function () { btn.disabled = false; });
    });
    progress();
  }

  function start(person) {
    me = person;
    d.getElementById('app').hidden = false;
    var total = DATA.items.length;
    if (me.role === 'coauthor') {
      d.getElementById('hello').textContent = 'Hi ' + me.first + ', here is what changed after the pilot';
      d.getElementById('intro').textContent = 'We went through every comment from the pilot. For each item below you see the change, why we made it, what you said about it, and what the others said (select a name to read it). Please accept or decline each one, with a note where useful. Items with your comments have a blue edge. It takes about 15 minutes; your answers are kept as you go.';
      d.getElementById('mine-only-wrap').hidden = false;
    } else {
      d.getElementById('hello').textContent = 'All changes after the pilot, with every comment';
      d.getElementById('intro').textContent = 'The overview: every change, its reason, and every co-author comment behind it (hover or select a name). You can accept or decline too; your answers are sent like the others.';
    }
    render();
  }

  if (!TOKEN || !window.crypto || !crypto.subtle) { d.getElementById('nolink').hidden = false; return; }
  crypto.subtle.digest('SHA-256', new TextEncoder().encode(TOKEN)).then(function (buf) {
    var hex = Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    var person = DATA.people.filter(function (p) { return p.hash === hex; })[0];
    if (!person) { d.getElementById('nolink').hidden = false; return; }
    start(person);
  });
})();
</script>
</body>
</html>
