<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Pilot review - LLM self-explanations</title>
<style>
/* The pilot review: one compact card per survey page, changes marked in place. */
:root {
  --rv-page: #f4f3ee; --rv-card: #ffffff; --rv-line: #e3e1d8; --rv-line-strong: #c9c6ba;
  --rv-text: #1f1e1c; --rv-2: #5d5b55; --rv-3: #8b8982;
  --rv-add-bg: #e3f1e6; --rv-add: #1f6a3b; --rv-del: #a2332b;
  --rv-warn-bg: #faeeda; --rv-warn: #7c4a08; --rv-warn-line: #e6b566;
  --rv-acc-bg: #e6f0fa; --rv-acc: #0f4a80;
  --rv-no-bg: #f8e5e3;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--rv-page); color: var(--rv-text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
.rv { max-width: 760px; margin: 0 auto; padding: 20px 16px 56px; }
.rv .nolink { padding: 40px 0; color: var(--rv-2); }
.rv .card { background: var(--rv-card); border: 1px solid var(--rv-line); border-radius: 12px; padding: 0 20px 18px; }

.rv .bar { position: sticky; top: 0; z-index: 5; background: var(--rv-card); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rv-line); font-size: 13px; color: var(--rv-2); border-radius: 12px 12px 0 0; }
.rv .bar .right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
.rv .pill { background: var(--rv-acc-bg); color: var(--rv-acc); padding: 2px 10px; border-radius: 8px; white-space: nowrap; }
.rv .pill.done { background: var(--rv-add-bg); color: var(--rv-add); }
.rv .bar select { font: inherit; font-size: 13px; color: var(--rv-2); border: 1px solid var(--rv-line); border-radius: 8px; background: var(--rv-card); padding: 3px 6px; max-width: 15rem; }

.rv .intro { margin: 14px 0 0; color: var(--rv-2); font-size: 13px; max-width: 68ch; }

.rv .pair { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0 6px; }
.rv .pair a { display: block; height: 104px; border: 1px solid var(--rv-line); border-radius: 8px; overflow: hidden; background: #f3f4f6; }
.rv .pair img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
.rv .pair-note { font-size: 12px; color: var(--rv-3); margin: 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.rv .pair-note .tags { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.rv .pair-note .tags .mk { margin-left: 0; }

.rv .dimname { font-weight: 600; margin: 18px 0 4px; font-size: 14px; }
.rv .def { margin: 0; color: var(--rv-2); }
.rv .subhead { font-weight: 600; margin: 20px 0 8px; font-size: 14px; }
.rv .sd { border-top: 1px solid var(--rv-line); padding: 10px 0; }
.rv .sd-name { margin: 0; font-weight: 600; }
.rv .sd-def { margin: 2px 0; }
.rv .sd-chars { margin: 0; font-size: 13px; color: var(--rv-2); }
.rv .moved { font-size: 12px; font-weight: 400; background: var(--rv-add-bg); color: var(--rv-add); border-radius: 8px; padding: 1px 8px; margin-left: 6px; white-space: nowrap; }
.rv .stmt { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--rv-3); margin-top: 6px; }
.rv .stmt span:last-child { white-space: nowrap; }
.rv .stmts { margin-top: 8px; }

.rv del { color: var(--rv-del); text-decoration: line-through; }
.rv ins { background: var(--rv-add-bg); color: var(--rv-add); text-decoration: none; border-radius: 3px; padding: 0 2px; }

/* the small marker that opens a change's comments */
.rv .mk { display: inline-flex; align-items: center; gap: 4px; font: inherit; font-size: 12px; line-height: 1.5; background: var(--rv-warn-bg); color: var(--rv-warn); border: 0; border-radius: 8px; padding: 1px 8px; margin-left: 6px; cursor: pointer; white-space: nowrap; vertical-align: 1px; }
.rv .mk svg { width: 13px; height: 13px; flex: none; }
.rv .mk.quiet { background: #eeede8; color: var(--rv-2); }
.rv .mk.yes { background: var(--rv-add-bg); color: var(--rv-add); }
.rv .mk.no { background: var(--rv-no-bg); color: var(--rv-del); }
.rv .mk[aria-expanded="true"] { box-shadow: 0 0 0 2px var(--rv-warn-line); }
.rv .mk:focus-visible, .rv .seg button:focus-visible, .rv .btn:focus-visible { outline: 2px solid #2b6cb0; outline-offset: 2px; }

.rv .box { margin: 10px 0 4px 24px; border: 1px solid var(--rv-line-strong); border-radius: 12px; padding: 12px 14px; background: var(--rv-card); max-width: 540px; }
.rv .box .t { font-weight: 600; font-size: 13px; margin: 0 0 8px; }
.rv .box .k { margin: 0 0 4px; font-size: 12px; color: var(--rv-3); }
.rv .box .mine { margin: 0 0 10px; background: var(--rv-acc-bg); color: var(--rv-acc); padding: 6px 10px; border-radius: 8px; font-size: 13px; white-space: pre-line; }
.rv .box .other { margin: 0 0 6px; font-size: 13px; white-space: pre-line; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; cursor: pointer; }
.rv .box .other.open { display: block; cursor: auto; }
.rv .box .other .who { font-weight: 600; }
.rv .box .gap { height: 4px; }
.rv .box .txt { margin: 0 0 10px; font-size: 13px; color: var(--rv-2); }
.rv .box .differ { margin: 0 0 10px; font-size: 13px; background: var(--rv-warn-bg); color: var(--rv-warn); border-radius: 8px; padding: 6px 10px; }
.rv .box .also { margin: 0 0 10px; font-size: 12px; color: var(--rv-3); }
.rv .box .ans { display: flex; gap: 8px; align-items: center; margin-top: 2px; }
.rv .seg { display: inline-flex; gap: 8px; flex: none; }
.rv .seg button, .rv .btn { font: inherit; font-size: 13px; background: var(--rv-card); color: var(--rv-text); border: 1px solid var(--rv-line-strong); border-radius: 8px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
.rv .seg button:hover, .rv .btn:hover { background: #f6f5f0; }
.rv .seg button[aria-pressed="true"].c0 { background: var(--rv-add-bg); color: var(--rv-add); border-color: #9fcfb0; }
.rv .seg button[aria-pressed="true"].c1 { background: var(--rv-no-bg); color: var(--rv-del); border-color: #e3aaa5; }
.rv .box input[type="text"], .rv .final textarea { font: inherit; font-size: 13px; flex: 1; min-width: 0; width: 100%; border: 1px solid var(--rv-line-strong); border-radius: 8px; padding: 5px 10px; background: var(--rv-card); color: var(--rv-text); }

.rv .rows .row { border-top: 1px solid var(--rv-line); padding: 10px 0; }
.rv .rows .row .ttl { font-weight: 600; margin: 0; }
.rv .rows .row .was { margin: 2px 0 0; }
.rv .more { font-weight: 600; margin: 22px 0 2px; font-size: 14px; }
.rv .more-note { font-size: 12px; color: var(--rv-3); margin: 0 0 8px; }

.rv .nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--rv-line); }
.rv .btn.go { background: var(--rv-text); color: #fff; border-color: var(--rv-text); }
.rv .btn.go:hover { background: #3a3936; }
.rv .final { margin-top: 18px; display: grid; gap: 8px; }
.rv .final label { font-weight: 600; }
.rv .final label span { font-weight: 400; color: var(--rv-3); font-size: 12px; }
.rv .status { font-size: 13px; color: var(--rv-2); }
.rv .err { color: var(--rv-del); }
.rv .legend { margin: 10px 4px 0; font-size: 12px; color: var(--rv-2); }
@media (max-width: 560px) { .rv .box { margin-left: 0; } .rv .box .ans { flex-wrap: wrap; } .rv .pair a { height: 84px; } }

</style>
</head>
<body>
<main class="rv">
  <p class="nolink" id="nolink" hidden>Please open this page through your personal survey link.</p>
  <div id="app" hidden>
    <div class="card">
      <div class="bar"><span id="where"></span><span class="right"><span class="pill" id="count"></span><select id="pagesel" aria-label="Go to page"></select></span></div>
      <div id="sections"></div>
    </div>
    <p class="legend"><del>Struck through</del> is the pilot wording, <ins>highlighted</ins> is the new wording. A marker next to a change shows how many comments are behind it; select it to read them and answer. <span id="overall-count"></span>.</p>
  </div>
</main>

ng as it appears on the page: whether it follows one path or weighs alternatives, whether every claim gets a reason, whether it says why this rather than something else, where the conclusion sits, and how much of the reasoning process is shown."}],"pair":["img/pair07_structural_variant_annotated.svg","img/pair07_structural_baseline_annotated.svg"],"statements":[{"text":"The definition of this dimension is clear.","pid":"D4_Q4"},{"text":"This dimension is clearly different from the other six dimensions.","pid":"D4_Q5"},{"text":"This dimension should be part of the taxonomy.","pid":"D4_Q6"}],"subs":[{"key":"D4_S1","name":[{"t":"s","s":"Reasoning form"}],"moved":"","def":[{"t":"d","s":"The path of the reasoning"},{"t":"a","s":"Whether the reasoning follows one line or weighs alternatives"}],"chars":[{"t":"s","s":"linear"},{"t":"s","s":"branching (alternatives considered)"}],"statements":[{"text":"The definition is clear.","pid":"D4_S1_Q9"},{"text":"This subdimension is clearly different from all other subdimensions in the taxonomy.","pid":"D4_S1_Q10"}]},{"key":"D4_S2","name":[{"t":"s","s":"Completeness"}],"moved":"","def":[{"t":"s","s":"Whether every claim in the answer has a stated reason"}],"chars":[{"t":"s","s":"full"},{"t":"s","s":"partial"}],"statements":[{"text":"The definition is clear.","pid":"D4_S2_Q9"},{"text":"This subdimension is clearly different from all other subdimensions in the taxonomy.","pid":"D4_S2_Q10"}]},{"key":"D4_S3","name":[{"t":"s","s":"Contrastive form"}],"moved":"","def":[{"t":"s","s":"Whether the explanation says why this rather than an alternative"}],"chars":[{"t":"s","s":"non-contrastive"},{"t":"s","s":"contrastive"}],"statements":[{"text":"The definition is clear.","pid":"D4_S3_Q9"},{"text":"This subdimension is clearly different from all other subdimensions in the taxonomy.","pid":"D4_S3_Q10"}]},{"key":"D4_S4","name":[{"t":"s","s":"Ordering"}],"moved":"","def":[{"t":"s","s":"Position of the conclusion within the explanation"}],"chars":[{"t":"s","s":"conclusion first"},{"t":"s","s":"reasons first"},{"t":"s","s":"interleaved"}],"statements":[{"text":"The definition is clear.","pid":"D4_S4_Q9"},{"text":"This subdimension is clearly different from all other subdimensions in the taxonomy.","pid":"D4_S4_Q10"}]},{"key":"D4_S5","name":[{"t":"s","s":"Trace form"}],"moved":"","def":[{"t":"d","s":"How much of the reasoning process is shown"},{"t":"a","s":"How much of the step-by-step reasoning that produced the answer is shown"}],"chars":[{"t":"s","s":"rationale only (reasons without the process that produced them)"},{"t":"s","s":"summarized trace"},{"t":"s","s":"full trace"}],"statements":[{"text":"The definition is clear.","pid":"D4_S5_Q9"},{"text":"This subdimension is clearly different from all other subdimensions in the taxonomy.","pid":"D4_S5_Q10"}]}]}},{"key":"D5","title":"Delivery","dim":{"id":"D5","name":[{"t":"s","s":"Delivery"}],"def":[{"t":"s","s":"Delivery covers when and how the explanation reaches the user: whether it comes before, with, or after the answer; whether it is shown by default or on request; whether more can be revealed in steps; through which channel; and what the user can do with it."}],"pair":["img/pair02_delivery_baseline_annotated.svg","img/pair02_delivery_variant_annotated.svg"],"statements":[{"text":"The definition of this dimension is clear.","pid":"D5_Q4"},{"text":"This dimension is clearly different from the other six dimensions.","pid":"D5_Q5"},{"text":"This dimension should be part of the taxonomy.","pid":"D5_Q6"}],"subs":[{"key":"D5_S1","name":[{"t":"s","s":"Timing"}],"moved":"","def":[{"t":"s","s":"When the explanation appears relative to the answer"}],"chars":[{"t":"s","s":"before answer"},{"t":"s","s":"with answer"},{"t":"s","s":"after answer"},{"t":"s","s":"adaptive to user state"}],"statements":[{"text":"The definition is clear.","pid":"D5_S1_Q9"},{"text":"This subdimension is clearly different from all other subdimensions in the taxonomy.","pid":"D5_S1_Q10"}]},{"key":"D5_S2","name":[{"t":"s","s":"Availability"}],"moved":"","def":[{"t":"s","s":"Whether the explanation is shown by default"}],"chars":[{"t":"s","s":"always shown"},{"t":"s","s":"on request"}],"statements":[{"text":"The definition is clear.","pid":"D5_S2_Q9"},{"text":"This subdimension is clearly different from all other subdimensions in the taxonomy.","pid":"D5_S2_Q10"}]},{"key":"D5_S3","name":[{"t":"s","s":"Progressive disclosure"}],"moved":"","def":[{"t":"d","s":"Whether"},{"t":"a","s":"Once shown, whether"},{"t":"s","s":"more detail can be"},{"t":"d","s":"revealed"},{"t":"a","s":"opened"},{"t":"s","s":"in steps"}],"chars":[{"t":"s","s":"single level"},{"t":"s","s":"expandable"}],"statements":[{"text":"The definition is clear.","pid":"D5_S3_Q9"},{"text":"This subdimension is clearly different from all other subdimensions in the taxonomy.","pid":"D5_S3_Q10"}]},{"key":"D5_S4","name":[{"t":"s","s":"Modality"}],"moved":"","def":[{"t":"d","s":"The channel of the explanation"},{"t":"a","s":"The medium through which the explanation is delivered"}],"chars":[{"t":"s","s":"text"},{"t":"s","s":"speech"},{"t":"s","s":"visual"},{"t":"s","s":"multimodal"}],"statements":[{"text":"The definition is clear.","pid":"D5_S4_Q9"},{"text":"This subdimension is clearly different from all other subdimensions in the taxonomy.","pid":"D5_S4_Q10"}]},{"key":"D5_S5","name":[{"t":"s","s":"Interactivity"}],"moved":"","def":[{"t":"s","s":"What the user can do with the shown reasoning"}],"chars":[{"t":"s","s":"read-only"},{"t":"s","s":"navigable (the user can expand, collapse, or move between steps)"},{"t":"s","s":"editable"}],"statements":[{"text":"The definition is clear.","pid":"D5_S5_Q9"},{"text":"This subdimension is clearly different from all other subdimensions in the taxonomy.","pid":"D5_S5_Q10"}]}]}},{"key":"D6","title":"Source","dim":{"id":"D6","name":[{"t":"s","s":"Source"}],"def":[{"t":"s","s":"Source covers what the explanation rests on and how the user can check it: whether the shown reasons come from the process that produced the answer or were generated afterward, and how external evidence is linked."}],"pair":["img/pair03_source_baseline_annotated.svg","img/pair03_source_variant_annotated.svg"],"statements":[{"text":"The definition of this dimension is clear.","pid":"D6_Q4"},{"text":"This dimension is clearly different from the other six dimensions.","pid":"D6_Q5"},{"text":"This dimension should be part of the taxonomy.","pid":"D6_Q6"}],"subs":[{"key":"D6_S1","name":[{"t":"s","s":"Provenance"}],"moved":"","def":[{"t":"d","s":"How the explanation relates to the process that produced the answer"},{"t":"a","s":"Whether the explanation is the reasoning produced before the answer, or a justification written after it"}],"chars":[{"t":"d","s":"from reasoning trace"},{"t":"a","s":"reasoning produced before the answer"},{"t":"d","s":"post hoc"},{"t":"a","s":"justification written after the answer"},{"t":"d","s":"post hoc and verified"},{"t":"a","s":"justification written after and checked against the reasoning"}],"statements":[{"text":"The definition is clear.","pid":"D6_S1_Q9"},{"text":"This subdimension is clearly different from all other subdimensions in the taxonomy.","pid":"D6_S1_Q10"}]},{"key":"D6_S2","name":[{"t":"s","s":"Citations and grounding"}],"moved":"","def":[{"t":"s","s":"How external evidence is linked; if several forms occur, the strongest"}],"chars":[{"t":"s","s":"none"},{"t":"s","s":"attribution (source named)"},{"t":"s","s":"citation (source linked)"},{"t":"s","s":"quotation with link (verbatim passage, source linked)"}],"statements":[{"text":"The definition is clear.","pid":"D6_S2_Q9"},{"text":"This subdimension is clearly different from all other subdimensions in the taxonomy.","pid":"D6_S2_Q10"}]}]}},{"key":"D7","title":"Semantic","dim":{"id":"D7","name":[{"t":"s","s":"Semantic"}],"def":[{"t":"d","s":"Semantic covers what the explanation claims and for whom: whether the reasons are true and support the answer, whether the explanation and the answer agree, and whether the explanation is adapted to the user."},{"t":"a","s":"Semantic covers what the explanation claims: whether its reasons are correct and support the answer, and whether the explanation agrees with the answer."}],"pair":["img/pair04_semantic_variant_annotated.svg","img/pair04_semantic_baseline_annotated.svg"],"statements":[{"text":"The definition of this dimension is clear.","pid":"D7_Q4"},{"text":"This dimension is clearly different from the other six dimensions.","pid":"D7_Q5"},{"text":"This dimension should be part of the taxonomy.","pid":"D7_Q6"}],"subs":[{"key":"D7_S1","name":[{"t":"s","s":"Correctness of reasoning"}],"moved":"","def":[{"t":"s","s":"Whether the stated reasons are"},{"t":"d","s":"true"},{"t":"a","s":"factually correct"},{"t":"s","s":"and support the answer"}],"chars":[{"t":"s","s":"correct"},{"t":"s","s":"partially correct"},{"t":"s","s":"incorrect"}],"statements":[{"text":"The definition is clear.","pid":"D7_S1_Q9"},{"text":"This subdimension is clearly different from all other subdimensions in the taxonomy.","pid":"D7_S1_Q10"}]},{"key":"D7_S2","name":[{"t":"s","s":"Consistency with answer"}],"moved":"","def":[{"t":"d","s":"Whether the explanation and the answer agree"},{"t":"a","s":"Whether the explanation agrees with the answer it accompanies or contradicts it"}],"chars":[{"t":"s","s":"consistent"},{"t":"s","s":"contradicts"}],"statements":[{"text":"The definition is clear.","pid":"D7_S2_Q9"},{"text":"This subdimension is clearly different from all other subdimensions in the taxonomy.","pid":"D7_S2_Q10"}]}]}},{"key":"whole","title":"Whole taxonomy"}],"overview":false,"names":{},"items":[{"id":"t01","section":"taxonomy","title":"Provenance in plain words","why":"The old definition made \"post hoc\" true of every self-explanation, and its words were hard to follow. The new one names the actual difference: reasoning written before the answer, or a justification written after it.","conflict":"","old":"","change":"","at":["sub:D6_S1"],"comments":[{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"\"post hoc\" caught my attention here --- every self-explanation is post hoc, isn't it? In addition, I couldn't tell the difference between the examples in var A & B."},{"o":"4e41ddadd843ce14602ff0ef6c1ef91ac6fb88205958a0961b949cb70c4e7c75","text":"A bit hard to understand - mostly because there are many specialized technical words in the definition: provenance, \"relates to the process that produces the answer\", reasoning trace, etc. Perhaps it could be reformatted a bit with easier-to-understand wording, which would help people who are not extremely familiar with these terms."},{"o":"b368c90d801cd0f8acb8f839f64469e6017478624433dbc38d8cfdb7d894029c","text":"Maybe \"How the explanation relates to the process that produced the answer\" could be reformulated as in the dimension description \"whether the shown reasons come from the process that produced the answer or were generated afterward\""}]},{"id":"t02","section":"taxonomy","title":"Register and Warmth made independent","why":"Both shared \"neutral\" and read as one scale. Register is now only how formal the language is; Warmth is only whether the text expresses care.","conflict":"One suggestion was to merge the two into \"tone of voice\"; others asked for clearer definitions. We kept them apart, since a formal text can still be warm. The merge is left to the experts.","old":"","change":"","at":["sub:D3_S2","sub:D3_S3"],"comments":[{"o":"4e41ddadd843ce14602ff0ef6c1ef91ac6fb88205958a0961b949cb70c4e7c75","text":"I think the subdimensions \"Register\" and \"Warmth\" are closely related and could overlap. Both, for example, have \"neutral\" as an example. And for me, formal is one end of the spectrum, neutral is in the middle, and warm/casual is on the other end. In my mind, I would refer to both subdimensions as \"tone of voice\""},{"o":"4e41ddadd843ce14602ff0ef6c1ef91ac6fb88205958a0961b949cb70c4e7c75","text":"I think the subdimensions \"Register\" and \"Warmth\" are closely related and could overlap. Both, for example, have \"neutral\" as an example. And for me, formal is one end of the spectrum, neutral is in the middle, and warm/casual is on the other end. In my mind, I would refer to both subdimensions as \"tone of voice\""},{"o":"c523f2438da8f7906a70f121986d505049f2b461f1ede434cfca3214c3d1eb21","text":"Warmth and register sound similar, although I understand they are different. Maybe better definitions?"},{"o":"b368c90d801cd0f8acb8f839f64469e6017478624433dbc38d8cfdb7d894029c","text":"I feel Framing (if includes the tool voice) Register and Warmth have an overlapping/intersection"},{"o":"b368c90d801cd0f8acb8f839f64469e6017478624433dbc38d8cfdb7d894029c","text":"Maybe could be reframed as \"Whether and how the explanation directs emotional or relational cues at the user\". I had to search what 'stance' mean and maybe 'approach' or 'attituted' is a more know one?\nI feel Framing (if includes the tool voice) Register and Warmth have an overlapping/intersection"}]},{"id":"t03","section":"taxonomy","title":"Tailoring moved to Interpersonal stance","why":"Tailoring is about the relation to the user, not about what the explanation claims. Semantic loses \"for whom\"; Interpersonal stance gains Tailoring as its last subdimension.","conflict":"Three comments questioned Tailoring’s place in Semantic. One suggested keeping it and defining it as whether the explanation highlights that it is tailored; we moved it and left its definition as it was.","old":"","change":"","at":["sub:D3_S6","dim:D7","dim:D3"],"comments":[{"o":"4e41ddadd843ce14602ff0ef6c1ef91ac6fb88205958a0961b949cb70c4e7c75","text":"I think the \"for whom\" part of the definition is a different question and a bit out of scope for me; it's a bit confusing. It would be clearer if the \"Dimension: Semantic\" focused on the explanation's claim, its truthfulness, reasoning, and support for the answer. The \"for whom\" part, I think, is more for the \"Dimension: Interpersonal\"\n\n- This \"Dimension: Semantic\" for me is also very related/might overlap with both \"Dimension: Epistemic stance\" (also about claims, reasoning, how sure it is) and \"Dimension: Structural\" (that also deals with claims, reasoning, one path/multiple paths). Variation A, for example, could also be about the dimensions: Structural, Semantic, and Epistemic. \n\nI almost feel like the dimensions Semantic and Epistemic stance could be combined. This may be because both terms are related linguistically and philosophically, and it is hard to separate a semantic issue from an epistemic one, especially for AI explanations."},{"o":"b368c90d801cd0f8acb8f839f64469e6017478624433dbc38d8cfdb7d894029c","text":"\"for whom\" I don't see how.. and it looks a bit of pragmatic instead of Semantic, maybe could be reformulated as \"and wether the content is tailored to the user\".. also being tailored is a part of the semantic?"},{"o":"c523f2438da8f7906a70f121986d505049f2b461f1ede434cfca3214c3d1eb21","text":"It is not clear to me why tailoring is part of semantics. Secondly unclear to me why an incorrect reasoning would be a design decision"},{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"- The term \"Semantics\" is very broad, covering anything related to the meaning of explanations. The three sub-dimensions seem to point to the quality of the explanations. Perhaps it's worth rethinking how we name this category?"},{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"- correctness of reasoning: Whether the stated reasons are true and support the answer. The word \"true\" here is a bit unclear. True as in it matches the model's underlying process (i.e., fidelity)? Perhaps you only care about  whether the explanations \"support the answer\"? If so, I'd remove \" are true\"\n- Consistency with answer -> Consistency with the answer the explanations are about. (See below about shaded phrase)\n- Tailoring to the user: \"Whether the explanation is adapted to what the system knows about the user\" -> \"Whether the explanation HIGHLIGHTS THAT IT IS adapted to what the system knows about the user\". The reason is that sometimes an explanation is implicitly personalized. Unless the explanation highlights that, it is hard to know."}]},{"id":"t04","section":"taxonomy","title":"Correctness and Consistency sharpened","why":"Correctness now concerns whether the reasons are factually right; Consistency concerns whether the explanation agrees with its own answer.","conflict":"One suggestion was to merge the two; another was to drop \"are true\" from Correctness and keep only \"support the answer\". We kept both subdimensions, and kept truth in Correctness as \"factually correct\": an explanation can support its answer with a false reason.","old":"","change":"","at":["sub:D7_S1","sub:D7_S2"],"comments":[{"o":"4e41ddadd843ce14602ff0ef6c1ef91ac6fb88205958a0961b949cb70c4e7c75","text":"I think \"Correctness of reasoning\" and \"Consistency with answer\" are closely related and may overlap."},{"o":"4e41ddadd843ce14602ff0ef6c1ef91ac6fb88205958a0961b949cb70c4e7c75","text":"I think \"Correctness of reasoning\" and \"Consistency with answer\" are closely related and may overlap."},{"o":"4e41ddadd843ce14602ff0ef6c1ef91ac6fb88205958a0961b949cb70c4e7c75","text":"I would merge the first two subdimensions."},{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"- correctness of reasoning: Whether the stated reasons are true and support the answer. The word \"true\" here is a bit unclear. True as in it matches the model's underlying process (i.e., fidelity)? Perhaps you only care about  whether the explanations \"support the answer\"? If so, I'd remove \" are true\"\n- Consistency with answer -> Consistency with the answer the explanations are about. (See below about shaded phrase)\n- Tailoring to the user: \"Whether the explanation is adapted to what the system knows about the user\" -> \"Whether the explanation HIGHLIGHTS THAT IT IS adapted to what the system knows about the user\". The reason is that sometimes an explanation is implicitly personalized. Unless the explanation highlights that, it is hard to know."}]},{"id":"t05","section":"taxonomy","title":"\"No position stated\" added","why":"Users often ask without taking a position, as in the example. Every explanation must still fall into exactly one characteristic.","conflict":"","old":"","change":"","at":["sub:D3_S4"],"comments":[{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"I'm not sure that users always come with a position. IN this example, the user asks the LLM a question, without necessarily having a position."},{"o":"b368c90d801cd0f8acb8f839f64469e6017478624433dbc38d8cfdb7d894029c","text":"Maybe \"Stance toward the premise or view the user brought\" could be reframed as \"Attitude toward the view/position of the user\""}]},{"id":"t06","section":"taxonomy","title":"Hedging separated from Expressed confidence","why":"Expressed confidence is about the conclusion; Hedging is about individual reasons. The definition now says so. Disclaimer stays separate: it is a statement of limits, not a softened reason.","conflict":"","old":"","change":"","at":["sub:D2_S3"],"comments":[{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"Hedging seems very related to \"Expressed confidence\". Some clarification of the differences would be super helpful - or merge them?"},{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"Also seems related to \"hedging\"?"}]},{"id":"t07","section":"taxonomy","title":"Confidence granularity renamed Confidence scope","why":"The old name was hard to read; the definition now says what it means.","conflict":"","old":"","change":"","at":["sub:D2_S2"],"comments":[{"o":"b368c90d801cd0f8acb8f839f64469e6017478624433dbc38d8cfdb7d894029c","text":"Maybe \"The level at which confidence is attached\" could be formulated as \"Whether the confidence is attached to the whole answer or to individual claims\" or \"The unit that each confidence estimate refers to\" or \"The scope of each confidence estimate\""},{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"\"confidence granularity\" sounds a bit odd. But I don't think I understand it enough to suggest alternatives."}]},{"id":"t08","section":"taxonomy","title":"Framing characteristics with examples","why":"It was unclear what \"tool voice\" and \"user-directed\" mean; each characteristic now carries a short example.","conflict":"Two renamings were suggested (\"the person in which the explanation is written\", and \"perspective\"). We kept the name and added examples instead.","old":"","change":"","at":["sub:D3_S1"],"comments":[{"o":"c523f2438da8f7906a70f121986d505049f2b461f1ede434cfca3214c3d1eb21","text":"Characteristics are rather unclear. Are they examples, or categories? In the examples as well, user-directed is still reading as first-person..."},{"o":"b368c90d801cd0f8acb8f839f64469e6017478624433dbc38d8cfdb7d894029c","text":"I think this could really benefit a reformulation but I'm not sure how. Maybe \"The person in which the explanation is written\" but then the 'tool voice' would be lost, what about maybe here it is kinda exiting the boundaries and entering the territory of the Register and Warmth.. Or maybe I'm just not understanding tool voice"},{"o":"b368c90d801cd0f8acb8f839f64469e6017478624433dbc38d8cfdb7d894029c","text":"See above. Maybe reformulating Framing as \"The person in which the explanation is written\" and \"Formality toward the user\" as \"Language formality\" (taking out the specific reference to the interpersonal relationship, conserving it implicitly) would leave the space for all of them (like in the example given)"},{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"Some renaming suggestions: Feel free to ignore any or all of these\n- \"framing\" could be \"perspective\"? -> AI's perspective, user's perspective\n- \"warmth\" could be \"affective tone\"? \"validating\"?\n- \"agreement\", \"persuasive appeals\" (see my comments above)\nperhaps we could benefit from someone who has expertise in linguistics or rhetoric to look at these taxonomy"}]},{"id":"t09","section":"taxonomy","title":"Trace form defined in plain words","why":"\"Trace\" was not defined. Trace form is how much of the reasoning is shown; where the explanation comes from is Provenance.","conflict":"","old":"","change":"","at":["sub:D4_S5"],"comments":[{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"Similar as before, given the probabilistic nature of LLMs, how we can know what is \"full trace\"? (Also, the word trace could be defined... Personally I don't know what precise it is)"},{"o":"c523f2438da8f7906a70f121986d505049f2b461f1ede434cfca3214c3d1eb21","text":"Trace form looks similar to Provenance, at least in the example"}]},{"id":"t10","section":"taxonomy","title":"Reasoning form reworded","why":"\"The path of the reasoning\" was unclear.","conflict":"","old":"","change":"","at":["sub:D4_S1"],"comments":[{"o":"b368c90d801cd0f8acb8f839f64469e6017478624433dbc38d8cfdb7d894029c","text":"I think \"The path of the reasoning\" could be formulated as \"Whether it follows one path or weighs alternatives\" (taking the sentence structure from Completeness) and \"Whether the explanation says why this rather than an alternative\" could be formulated as \"Whether the explanation accounts for why this outcome occurred and not another\" or \"Whether the explanation addresses the counterfactual, i.e. why not the alternative.\"\n\nIt is not very important tho, that is why I kept 4 and not 3"},{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"I struggle a bit to understand what \"linear\" and \"branching\" refer to in the two examples.  I'm also not sure about the term \"path of reasoning\" here..."}]},{"id":"t11","section":"taxonomy","title":"Vocabulary says what \"specialized\" means","why":"It was unclear what counts as specialized.","conflict":"","old":"","change":"","at":["sub:D1_S2"],"comments":[{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"A few things that are unclear to me: \n- what constitutes as \"specialized\"? Jargon? \n- how do you define \"mostly\"? \n- This subdimension seems to overlap a bit with \"tone\" or \"register\" from some of the previous dimensions, at least just looking at the terminologies themselves."}]},{"id":"t12","section":"taxonomy","title":"Progressive disclosure separated from Availability","why":"Availability is whether the explanation is shown at all by default; Progressive disclosure is whether, once shown, more can be opened in steps.","conflict":"One comment could not tell it from \"on request\" (Availability); another saw it as part of Interactivity. We kept it separate and reworded it.","old":"","change":"","at":["sub:D5_S3"],"comments":[{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"I am not sure I can tell the difference between \"progressive disclosure\" and \"on request\"."},{"o":"b368c90d801cd0f8acb8f839f64469e6017478624433dbc38d8cfdb7d894029c","text":"I guess \"Timing\" could be equally reframed as \"Placing\" and then it would become a bit blurry between Delivery and Surface. \n\"Progressive disclosure\" isn't it a sub-subdimension of \"Interactivity\"?"}]},{"id":"t13","section":"taxonomy","title":"Modality: \"medium\" instead of \"channel\"","why":"\"Channel\" was ambiguous.","conflict":"","old":"","change":"","at":["sub:D5_S4"],"comments":[{"o":"b368c90d801cd0f8acb8f839f64469e6017478624433dbc38d8cfdb7d894029c","text":"Maybe \"The channel of the explanation\" should be formulated as \"The form in which the explanation is presented\" or \"The medium through which the explanation is delivered\" (channel is an ambiguous word). Also maybe \"What the user can do with the shown reasoning\" could be formulated as \"How far the user can go beyond reading the explanation\" or \"The actions the interface offers on the explanation\""}]},{"id":"t14","section":"taxonomy","title":"Structural renamed Reasoning structure","why":"The label \"Structural\" did not say what the dimension holds; all five subdimensions concern the form of the reasoning.","conflict":"One co-author found the label confusing; another saw no reason to rename it.","old":"","change":"","at":["dim:D4"],"comments":[{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"I am a bit confused about the label \"structural\" and the subdimensions it contains."},{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"Hmmm....  The connection between the subdimensions is slightly unclear to me. Some explanations of how you picked these specific ones could be helpful."}]},{"id":"e01","section":"pairs","title":"A clear Register contrast","why":"Both variations read as casual.","conflict":"","old":"","change":"Variation A clearly neutral or formal, Variation B clearly casual.","at":["pair:D3"],"comments":[{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"Register: I don't perceive a big difference between the two variations. I might call both casual."}]},{"id":"e02","section":"pairs","title":"User-directed Framing throughout","why":"User-directed still read as first person.","conflict":"","old":"","change":"The variant addresses the reasoning to the user (\"You can see…\") throughout.","at":["pair:D3"],"comments":[{"o":"c523f2438da8f7906a70f121986d505049f2b461f1ede434cfca3214c3d1eb21","text":"Characteristics are rather unclear. Are they examples, or categories? In the examples as well, user-directed is still reading as first-person..."}]},{"id":"e03","section":"pairs","title":"Provenance made visible","why":"The two examples looked the same.","conflict":"","old":"","change":"A visible cue, for example a \"Reasoned for 8 seconds\" trace before the answer versus a \"Why?\" justification written afterwards.","at":["pair:D6"],"comments":[{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"\"post hoc\" caught my attention here --- every self-explanation is post hoc, isn't it? In addition, I couldn't tell the difference between the examples in var A & B."}]},{"id":"e04","section":"pairs","title":"Confidence for the whole answer","why":"Response-level confidence was not visible in Variation B.","conflict":"","old":"","change":"Variation B gets one statement of confidence about the whole answer, so \"both\" is visible.","at":["pair:D2"],"comments":[{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"I am having trouble seeing the response-level confidence granularity in Variation B..."}]},{"id":"e05","section":"pairs","title":"Progressive disclosure and multimodal made visible","why":"Progressive disclosure could not be told from \"on request\", and it was unclear why Variation B is multimodal.","conflict":"","old":"","change":"An expandable second level inside the opened explanation, and the confidence bar marked as the visual part.","at":["pair:D5"],"comments":[{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"I am not sure I can tell the difference between \"progressive disclosure\" and \"on request\"."},{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"I'm not sure on how Var B is multi-model."}]},{"id":"e06","section":"pairs","title":"Branching and completeness made visible","why":"Linear and branching were hard to see, and why Variation A counts as partial was unclear.","conflict":"","old":"","change":"The variant explicitly weighs a second reading before concluding, and the claim without a stated reason is marked.","at":["pair:D4"],"comments":[{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"I struggle a bit to understand what \"linear\" and \"branching\" refer to in the two examples.  I'm also not sure about the term \"path of reasoning\" here..."},{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"I would rate \"4\" based on the definition. However, I do not understand why Variation A is considered \"partial\" completion. Is it because it only lists 2 out of 3 reasons? But how would you (as designer/dev) know what is complete, since self-explanation may generate different answers each time?"}]},{"id":"e07","section":"pairs","title":"Contradict the classification itself","why":"The contradiction was with the recommended action, and the Correctness marks differed between the two examples.","conflict":"","old":"","change":"The variant’s explanation contradicts \"phishing\" itself, and Correctness is marked on the same reasons in both examples. Tailoring moves to the Interpersonal stance pair.","at":["pair:D7"],"comments":[{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"- Correctness (blue) in var A contains 1 reason and var B includes all 3. Should it be consistent?\n- consistency (yellow): I see the contradiction in var A. But in both cases, these are NOT the ML decision being explained (i.e., this is a phishing email). As I see it, to click or not to click is the action the LLM suggests based on that phishing decision."}]},{"id":"s01","section":"survey","title":"Time estimate","why":"The pilot took about 63 to 175 minutes (long idle visits not counted).","conflict":"","old":"About 25 to 30 minutes.","change":"About an hour; you can pause and come back with your link.","at":["page:survey"],"comments":[]},{"id":"s02","section":"survey","title":"The taxonomy is open to extension","why":"This only became clear late, from one closing question.","conflict":"","old":"","change":"Briefing: \"The taxonomy is not meant to be complete: if a property is missing, please tell us.\"","at":["page:survey"],"comments":[{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"Overall thought: I had an aha moment when one question said \"this taxonomy\" is meant to be expandable. It's worth telling people up front that these dimensions and subdimensions are not meant to be complete (or am I wrong?)"}]},{"id":"s03","section":"survey","title":"Some properties cannot be seen in the text","why":"Provenance, Trace form and Correctness were hard to judge from the examples alone.","conflict":"","old":"","change":"Briefing: \"Some properties, such as where an explanation comes from, cannot be seen in the text itself; the labels at the top of each example say which characteristic it has.\"","at":["page:survey"],"comments":[{"o":"c523f2438da8f7906a70f121986d505049f2b461f1ede434cfca3214c3d1eb21","text":"Again, a bit confusing with \"Provenance\""}]},{"id":"s04","section":"survey","title":"Consensus rule","why":"Four ratings of \"neither\" sit close together and counted as consensus. On the pilot data the stricter rule leaves out exactly the five weakest items.","conflict":"","old":"At least 70% agree, or an IQR of at most one point.","change":"At least 70% agree, or an IQR of at most one point with a median of at least 4.","at":["page:survey"],"comments":[]},{"id":"s05","section":"survey","title":"Optional comment boxes","why":"Many optional boxes held \"No\" or \"No further comment\".","conflict":"","old":"","change":"Under each optional comment box: \"Optional. Leave empty if you have nothing to add.\"","at":["page:survey"],"comments":[]},{"id":"x01","section":"experts","title":"Merge Semantic with Epistemic stance","why":"Both concern the claim, which makes them hard to tell apart when classifying. The revised definitions separate them (what is claimed versus how sure it sounds); whether that holds is the experts’ call.","conflict":"One co-author suggested the merge; the others rated both dimensions as belonging in the taxonomy.","old":"","change":"","at":["end:D7","end:D2"],"comments":[{"o":"4e41ddadd843ce14602ff0ef6c1ef91ac6fb88205958a0961b949cb70c4e7c75","text":"I think the Dimensions \"Semantic\" and \"Epistemic stance\" are closely related, since both concern the claim and how AI explanations present their reasoning to the user. But the difference is that semantic seems to concern how \"true\"/correct the reasoning is, while epistemic stance concerns how confident the explanation sounds."},{"o":"4e41ddadd843ce14602ff0ef6c1ef91ac6fb88205958a0961b949cb70c4e7c75","text":"I would consider merging this dimension with the \"Semantic\" dimension."},{"o":"4e41ddadd843ce14602ff0ef6c1ef91ac6fb88205958a0961b949cb70c4e7c75","text":"I would merge this dimension with the Dimension Epistemic Stance"},{"o":"4e41ddadd843ce14602ff0ef6c1ef91ac6fb88205958a0961b949cb70c4e7c75","text":"I agree mostly, except as I've explained, I think the dimensions \"Semantic\" and \"Epistemic stance\" are very related and may overlap, and it is not clear to me what would fit in one but not the other."},{"o":"4e41ddadd843ce14602ff0ef6c1ef91ac6fb88205958a0961b949cb70c4e7c75","text":"If I were to \"tag\" different LLM explanations as belonging to different dimensions, I would struggle to distinguish between Structural, Semantic, and Epistemic stances. \n\nThis is because all three deal with the claim and its reasoning. \n- Structural has the subdimension \"reasoning form\"\n- Semantic has the subdimension \"Correctness of reasoning\"\n- Epistemic stance has \"expressed confidence\"\n\nFor example: To be able to classify a self-explanation between these three, I first need to very carefully read the claim, break down the reasoning (Structural: \"reasoning form\"), and reason myself on whether the claim is true/correct or not (Semantic: \"Correctness of reasoning\" and \"consistency with answer\"), and based on that decide if the LLM presents it in an appropriate tone of voice (Epistemic Stance: \"expressed confidence\").\n\nAs you can see, that would require me to traverse all three dimensions. It is possible, but it requires more thinking and reasoning than I'd probably like to invest. This is not the case with the other 4 dimensions, which are clearly different."}]},{"id":"x02","section":"experts","title":"Merge Register and Warmth into \"tone of voice\"","why":"Formality and care can vary independently (a formal text can be warm), so they are kept apart with sharper definitions for now.","conflict":"","old":"","change":"","at":["end:D3"],"comments":[{"o":"4e41ddadd843ce14602ff0ef6c1ef91ac6fb88205958a0961b949cb70c4e7c75","text":"I would merge the subdimensions \"Register\" and \"Warmth\" into a single dimension, \"tone of voice,\" or something similar. Where there could be different levels/aspects such as: formal/professional, neutral, warm/friendly/casual"},{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"Other related semantic subdimensions to consider (feel free to ignore): tone of the voice, perspective (first person vs third person),"}]},{"id":"x03","section":"experts","title":"Make the taxonomy smaller","why":"Seven dimensions and 28 subdimensions is a lot to learn. Which to merge is what the expert ratings of \"belongs\" and \"clearly different\" are for.","conflict":"","old":"","change":"","at":["page:whole"],"comments":[{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"I am split on this --- 7 dimensions and 28 subdimensions seem a lot. I am not sure whether they cannot be further consolidated (some suggests are in prev pages). Additional thoughts - \"Source\" could be merged under \"epistemic stance.\""},{"o":"c523f2438da8f7906a70f121986d505049f2b461f1ede434cfca3214c3d1eb21","text":"It is definitely comprehensive, but not, per se, concise, in my opinion. It would take a lot of time to familiarize ourselves, as it is very detailed"}]},{"id":"x04","section":"experts","title":"Rename Epistemic stance to Confidence","why":"The dimension also holds Hedging and Disclaimer, which are not confidence as such.","conflict":"","old":"","change":"","at":["end:D2"],"comments":[{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"“Epistemic stance\" might be a bit abstract here. Have you considered \"confidence\"?"}]},{"id":"x05","section":"experts","title":"Move Detail to Reasoning structure","why":"Detail is about how much support each reason gets, which is visible before reading closely; the experts can judge whether it belongs to Surface.","conflict":"","old":"","change":"","at":["sub:D1_S4"],"comments":[{"o":"b368c90d801cd0f8acb8f839f64469e6017478624433dbc38d8cfdb7d894029c","text":"Detail can be hard to actually code before the reading the content I think, and if it requires to read the content then it could be move to Structural as well..."}]},{"id":"x06","section":"experts","title":"Delivery and Surface: rename or redraw the line","why":"Surface is what the text looks like; Delivery is when and how the interface presents it. The experts’ distinctness ratings will show whether the line holds.","conflict":"","old":"","change":"","at":["end:D5"],"comments":[{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"\"Delivery\" seems to be quite related to \"Surface\" - Perhaps you could name this \"Interactivity\"?"},{"o":"b368c90d801cd0f8acb8f839f64469e6017478624433dbc38d8cfdb7d894029c","text":"I guess \"Timing\" could be equally reframed as \"Placing\" and then it would become a bit blurry between Delivery and Surface. \n\"Progressive disclosure\" isn't it a sub-subdimension of \"Interactivity\"?"}]},{"id":"k01","section":"kept","title":"Length thresholds stay fixed","why":"Fixed sentence counts keep coding the same across studies; what counts as long for a given decision is left to the study that uses the taxonomy.","conflict":"","old":"","change":"","at":["sub:D1_S1"],"comments":[{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"- length: the definition is clear. What is long/medium/short can be contextual, depending on the decision being explained. So the hard limit on the number of sentences could be relaxed. \n-"}]},{"id":"k02","section":"kept","title":"Formatting does not mention \"layout\"","why":"\"Layout\" would pull in the interface around the text, which is Delivery.","conflict":"","old":"","change":"","at":["sub:D1_S3"],"comments":[{"o":"b368c90d801cd0f8acb8f839f64469e6017478624433dbc38d8cfdb7d894029c","text":"\"The typographic structure of the text\" maybe could benefit of adding the word \"layout\""}]},{"id":"k03","section":"kept","title":"A standing product disclaimer is not a Disclaimer","why":"A fixed line under every answer (\"AI can make mistakes\") is part of the interface, not of this explanation. Disclaimer counts statements inside the explanation.","conflict":"","old":"","change":"","at":["sub:D2_S4"],"comments":[{"o":"b368c90d801cd0f8acb8f839f64469e6017478624433dbc38d8cfdb7d894029c","text":"Isn't Disclaimer mandatory? Like \"Claude is an AI and can do mistake. Check the answers yourself\".. Or that doesn't count as explanation?"}]},{"id":"k04","section":"kept","title":"Persuasive appeals stays","why":"It covers rhetorical devices beyond stating reasons (authority, social proof, urgency, emotion), which Register and Warmth do not.","conflict":"One co-author suggested removing it; the other three rated it clearly different from all other subdimensions.","old":"","change":"","at":["sub:D3_S5"],"comments":[{"o":"c523f2438da8f7906a70f121986d505049f2b461f1ede434cfca3214c3d1eb21","text":"I wonder if some would coincide with \"Persuasive appeals\""},{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"Persuasive rhetoric can overlap with a mix of many things, such as \"register,\" \"warmth,\" \"persuasive appeals,\" possibly more just in this dimension. It seems to work at a higher level of abstraction than some of the other subdimensions here. A simpler solution is to just remove it to avoid the overlap, but maybe there are smarter solutions"}]},{"id":"k05","section":"kept","title":"Why these subdimensions","why":"Each comes from properties manipulated in prior studies (the position paper); the paper will say so per subdimension. Whether any are missing is a question in the expert round.","conflict":"","old":"","change":"","at":["end:D3"],"comments":[{"o":"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","text":"I like the name of this dimension. The 5 subdimensions are individually good, but I am missing why these particular 5. Could there be others? Are there existing linguistic/rhetoric theories and taxonomies that we can lean into?"}]},{"id":"k06","section":"kept","title":"General remarks","why":"Thank you.","conflict":"","old":"","change":"","at":["page:whole"],"comments":[{"o":"4e41ddadd843ce14602ff0ef6c1ef91ac6fb88205958a0961b949cb70c4e7c75","text":"Overall, I think the dimensions and subdimensions are very useful for describing the characteristics of LLM self-explanations. The examples are also very good for explaining AI explanations."}]}],"people":["98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4","4e41ddadd843ce14602ff0ef6c1ef91ac6fb88205958a0961b949cb70c4e7c75","c523f2438da8f7906a70f121986d505049f2b461f1ede434cfca3214c3d1eb21","b368c90d801cd0f8acb8f839f64469e6017478624433dbc38d8cfdb7d894029c"],"ratings":{"98ca2f5838b5fa5b640ad283711b9107bb88b26dd63f675e53197ce2f7f36bf4":{"D1_Q4":4,"D1_Q5":4,"D1_Q6":4,"D1_S1_Q9":4,"D1_S1_Q10":5,"D1_S2_Q9":3,"D1_S2_Q10":3,"D1_S3_Q9":4,"D1_S3_Q10":4,"D1_S4_Q9":4,"D1_S4_Q10":4,"D2_Q4":4,"D2_Q5":4,"D2_Q6":5,"D2_S1_Q9":4,"D2_S1_Q10":4,"D2_S2_Q9":3,"D2_S2_Q10":4,"D2_S3_Q9":3,"D2_S3_Q10":3,"D2_S4_Q9":3,"D2_S4_Q10":3,"D3_Q4":4,"D3_Q5":4,"D3_Q6":4,"D3_S1_Q9":4,"D3_S1_Q10":4,"D3_S2_Q9":5,"D3_S2_Q10":5,"D3_S3_Q9":4,"D3_S3_Q10":4,"D3_S4_Q9":3,"D3_S4_Q10":4,"D3_S5_Q9":3,"D <script>
/* The pilot review page. REVIEW_DATA and REVIEW_ENDPOINT are set by scripts/build-review.js. */
(function () {
  var DATA = window.REVIEW_DATA, ENDPOINT = window.REVIEW_ENDPOINT, d = document;
  var TOKEN = (location.search.match(/[?&]t=([A-Za-z0-9_-]{16,64})(?:&|$)/) || [])[1] || null;
  var KEY = 'delphi-review-' + (TOKEN || 'none');
  var state = { answers: {}, overall: '', submittedAt: null, page: null }, myHash = null;
  try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && s.answers) state = s; } catch (e) {}
  var RATING = { 1: 'Strongly disagree', 2: 'Disagree', 3: 'Neither', 4: 'Agree', 5: 'Strongly agree' };
  var DONE = { 'Accept': 'Accepted', 'Decline': 'Declined', 'Leave to experts': 'Left to experts', 'Change it now': 'Change now', 'Fine': 'Fine', 'Disagree': 'Disagree' };
  var ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 9h8M8 13h6M18 4a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-5l-5 3v-3H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z"/></svg>';
  var updaters = {}; // item id -> [functions to run when its answer changes]

  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function el(tag, cls, text) { var n = d.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function choicesOf(it) { return DATA.sections[it.section].choices; }
  function answered(it) { var a = state.answers[it.id]; return !!(a && a.choice != null); }
  function onChange(id, fn) { (updaters[id] = updaters[id] || []).push(fn); fn(); }

  var timer = null;
  function send(kind) {
    if (!ENDPOINT || !TOKEN) return Promise.reject(new Error('no address'));
    var body = JSON.stringify({ v: 1, token: TOKEN, kind: kind, page: 'pilot-review', state: { review: state } });
    return fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body })
      .then(function (r) { return r.json(); }).then(function (j) { if (!j || !j.ok) throw new Error((j && j.error) || 'not saved'); return j; });
  }
  function sendSoon() { clearTimeout(timer); timer = setTimeout(function () { send('progress').catch(function () {}); }, 800); }
  function changed(id) { save(); (updaters[id] || []).forEach(function (fn) { fn(); }); renderBar(); sendSoon(); }

  /* text with the pilot wording struck through and the new wording marked */
  function segs(list, sep) {
    var f = d.createDocumentFragment();
    list.forEach(function (g, i) {
      if (i) f.append(d.createTextNode(sep));
      f.append(g.parts ? segs(g.parts, ' ') : g.t === 'd' ? el('del', null, g.s) : g.t === 'a' ? el('ins', null, g.s) : d.createTextNode(g.s));
    });
    return f;
  }
  function differs(list) { return list.some(function (g) { return g.parts || g.t !== 's'; }); }

  function uniqueTexts(list) {
    var out = [];
    list.forEach(function (c) { if (!out.some(function (o) { return o.o === c.o && o.text === c.text; })) out.push(c); });
    return out;
  }

  function buildBox(it) {
    var box = el('div', 'box');
    box.append(el('p', 't', it.title));
    if (it.old) { box.append(el('p', 'k', 'Was')); var o = el('p', 'txt'); o.append(el('del', null, it.old)); box.append(o); }
    if (it.change) { box.append(el('p', 'k', it.old ? 'Now' : it.section === 'pairs' ? 'Planned change' : 'Change')); var c = el('p', 'txt'); c.append(el('ins', null, it.change)); box.append(c); }
    var all = uniqueTexts(it.comments);
    function other(x, who) {
      var p = el('p', 'other');
      if (who) p.append(el('span', 'who', who + ' '));
      p.append(d.createTextNode('“' + x.text + '”'));
      p.title = 'Select to read all of it';
      p.addEventListener('click', function () { p.classList.add('open'); p.removeAttribute('title'); });
      return p;
    }
    if (DATA.overview) {
      if (all.length) { box.append(el('p', 'k', 'Comments')); all.forEach(function (x) { box.append(other(x, DATA.names[x.o] || 'Co-author')); }); box.append(el('div', 'gap')); }
    } else {
      var own = all.filter(function (x) { return x.o === myHash; }), others = all.filter(function (x) { return x.o !== myHash; });
      if (own.length) { box.append(el('p', 'k', 'You said')); own.forEach(function (x) { box.append(el('p', 'mine', '“' + x.text + '”')); }); }
      if (others.length) { box.append(el('p', 'k', own.length ? 'Others said' : 'Co-authors said')); others.forEach(function (x) { box.append(other(x, '')); }); box.append(el('div', 'gap')); }
    }
    if (it.why) box.append(el('p', 'k', it.section === 'kept' ? 'Why we left it' : it.section === 'experts' ? 'Why we leave it to the experts' : 'Why we changed it'), el('p', 'txt', it.why));
    if (it.conflict) box.append(el('p', 'differ', 'Views differed. ' + it.conflict));
    if (it.at.length > 1) box.append(el('p', 'also', 'This change shows in ' + it.at.length + ' places; one answer covers all of them.'));

    var ans = el('div', 'ans'), seg = el('div', 'seg');
    choicesOf(it).forEach(function (label, i) {
      var b = el('button', 'c' + i, label); b.type = 'button';
      b.addEventListener('click', function () {
        var cur = state.answers[it.id] || {};
        cur.choice = cur.choice === i ? null : i; cur.label = cur.choice == null ? null : label;
        state.answers[it.id] = cur; changed(it.id);
      });
      seg.append(b);
    });
    var note = el('input'); note.type = 'text'; note.placeholder = 'Note (optional)'; note.setAttribute('aria-label', 'Note on ' + it.title);
    note.addEventListener('change', function () { var cur = state.answers[it.id] || {}; cur.note = note.value.trim(); state.answers[it.id] = cur; changed(it.id); });
    ans.append(seg, note); box.append(ans);
    onChange(it.id, function () {
      var a = state.answers[it.id] || {};
      seg.querySelectorAll('button').forEach(function (b, j) { b.setAttribute('aria-pressed', String(a.choice === j)); });
      if (d.activeElement !== note) note.value = a.note || '';
    });
    return box;
  }

  /* one item's marker; its box opens in `host` */
  function marker(it, host) {
    var b = el('button', 'mk'); b.type = 'button'; b.setAttribute('aria-expanded', 'false');
    var box = null, n = it.comments.length, quiet = it.section === 'kept' || it.section === 'experts';
    var what = it.section === 'pairs' ? 'Planned change' : it.section === 'experts' ? 'Left to the experts' : it.section === 'kept' ? 'Not changed' : 'Changed';
    onChange(it.id, function () {
      var a = state.answers[it.id];
      if (a && a.choice != null) {
        b.className = 'mk ' + (a.choice === 0 ? 'yes' : 'no');
        b.textContent = (a.choice === 0 ? '✓ ' : '✗ ') + (DONE[choicesOf(it)[a.choice]] || choicesOf(it)[a.choice]);
      } else {
        b.className = 'mk' + (quiet ? ' quiet' : '');
        b.innerHTML = ICON;
        b.append(d.createTextNode(it.section === 'pairs' ? 'Planned change' + (n ? ' · ' + n : '') : quiet ? what + (n ? ' · ' + n : '') : String(n || 'Changed')));
      }
      b.setAttribute('aria-label', what + ': ' + it.title + (n ? ', ' + n + (n === 1 ? ' comment' : ' comments') : ''));
    });
    b.addEventListener('click', function () {
      if (!box) { box = buildBox(it); host.append(box); b.setAttribute('aria-expanded', 'true'); }
      else { box.hidden = !box.hidden; b.setAttribute('aria-expanded', String(!box.hidden)); }
    });
    return b;
  }
  function itemsAt(anchor) { return DATA.items.filter(function (it) { return it.at.indexOf(anchor) !== -1; }); }
  function addMarkers(inline, host, anchor) { itemsAt(anchor).forEach(function (it) { inline.append(marker(it, host)); }); }

  function ratingLine(text, pid) {
    var label = '';
    if (DATA.overview) {
      var vs = (DATA.ratingsAll[pid] || []).map(function (v) { return v === 0 ? 'CJ' : v; });
      if (vs.length) label = 'Pilot ratings: ' + vs.join(', ');
    } else {
      var v = (DATA.ratings[myHash] || {})[pid];
      if (v !== undefined && v !== null) label = 'Your pilot rating: ' + (v === 0 ? 'cannot judge' : v + ' (' + RATING[v].toLowerCase() + ')');
    }
    if (!label) return null;
    var row = el('div', 'stmt'); row.append(el('span', null, text), el('span', null, label));
    return row;
  }

  function rows(sec, anchor) {
    var list = el('div', 'rows');
    itemsAt(anchor).forEach(function (it) {
      var row = el('div', 'row'), head = el('p', 'ttl', it.title), host = el('div');
      head.append(marker(it, host)); row.append(head);
      if (it.old || it.change) { var w = el('p', 'was'); if (it.old) w.append(el('del', null, it.old), d.createTextNode(' ')); if (it.change) w.append(el('ins', null, it.change)); row.append(w); }
      row.append(host); list.append(row);
    });
    sec.append(list);
  }

  function renderPage(p, index) {
    var sec = el('section'); sec.id = 'page-' + p.key; sec.hidden = true;
    if (p.key === 'survey') {
      sec.append(el('p', 'intro', DATA.overview
        ? 'The survey’s pages with every change after the pilot marked in place. Select a marker to see the comments behind a change, by name, and why we made it. You can accept or decline too.'
        : 'These are the survey’s pages with every change after the pilot marked in place. Select a marker to see what you said, what the other co-authors said, and why we changed it; then accept or decline. You do not rate anything again. It takes about 15 minutes, and your answers are kept as you go.'));
      sec.append(el('p', 'dimname', 'Changes to the survey itself'));
      rows(sec, 'page:survey');
    } else if (p.key === 'whole') {
      sec.append(el('p', 'dimname', 'Comments about the taxonomy as a whole'));
      rows(sec, 'page:whole');
      var fin = el('div', 'final');
      var lab = el('label'); lab.htmlFor = 'overall'; lab.append(d.createTextNode('Anything else about the revision? '), el('span', null, 'Optional'));
      var ta = el('textarea'); ta.id = 'overall'; ta.rows = 3; ta.value = state.overall || '';
      ta.addEventListener('change', function () { state.overall = ta.value.trim(); save(); sendSoon(); });
      var row = el('div', 'ans'), btn = el('button', 'btn go', 'Send my review'), sent = el('span', 'status'); btn.type = 'button';
      if (state.submittedAt) sent.textContent = 'Sent. You can still change answers and send again.';
      btn.addEventListener('click', function () {
        btn.disabled = true; sent.classList.remove('err'); sent.textContent = 'Sending…';
        state.submittedAt = new Date().toISOString(); save();
        send('complete').then(function () { sent.textContent = 'Sent. Thank you. You can still change answers and send again.'; })
          .catch(function () { sent.classList.add('err'); sent.textContent = 'Not sent. Your answers are kept in this browser; check your connection and try again.'; })
          .then(function () { btn.disabled = false; });
      });
      row.append(btn, sent); fin.append(lab, ta, row); sec.append(fin);
    } else {
      var dm = p.dim;
      var pair = el('div', 'pair'), pairHost = el('div');
      dm.pair.forEach(function (src, i) { var a = el('a'); a.href = src; a.target = '_blank'; a.rel = 'noopener'; a.title = 'Open variation ' + (i ? 'B' : 'A') + ' full size'; var im = el('img'); im.src = src; im.alt = 'Example, variation ' + (i ? 'B' : 'A') + ', as shown in the pilot'; im.loading = 'lazy'; a.append(im); pair.append(a); });
      var note = el('p', 'pair-note'); note.append(el('span', null, 'The example pair as shown in the pilot. Select one to see it full size.'));
      var tags = el('span', 'tags'); addMarkers(tags, pairHost, 'pair:' + dm.id); if (tags.childNodes.length) note.append(tags);
      sec.append(pair, note, pairHost);

      var h = el('p', 'dimname'); h.append(d.createTextNode('Dimension “'), segs(dm.name, ' '), d.createTextNode('”'));
      var def = el('p', 'def'); def.append(d.createTextNode('Definition: '), segs(dm.def, ' '));
      var dhost = el('div');
      addMarkers(differs(dm.name) ? h : def, dhost, 'dim:' + dm.id);
      sec.append(h, def, dhost);
      var st = el('div', 'stmts'); dm.statements.forEach(function (x) { var r = ratingLine(x.text, x.pid); if (r) st.append(r); }); sec.append(st);

      sec.append(el('p', 'subhead', 'Subdimensions'));
      dm.subs.forEach(function (sb) {
        var box = el('div', 'sd'); box.id = sb.key;
        var nm = el('p', 'sd-name'); nm.append(segs(sb.name, ' '));
        if (sb.moved) nm.append(el('span', 'moved', sb.moved));
        var df = el('p', 'sd-def'); df.append(segs(sb.def, ' '));
        var ch = el('p', 'sd-chars'); ch.append(d.createTextNode('Characteristics: '), segs(sb.chars, ', '));
        var host = el('div');
        /* the marker sits on the line that changed */
        addMarkers(differs(sb.name) || sb.moved ? nm : differs(sb.def) ? df : differs(sb.chars) ? ch : nm, host, 'sub:' + sb.key);
        box.append(nm, df, ch, host);
        sb.statements.forEach(function (x) { var r = ratingLine(x.text, x.pid); if (r) box.append(r); });
        sec.append(box);
      });
      if (itemsAt('end:' + dm.id).length) {
        sec.append(el('p', 'more', 'Other suggestions about this dimension'), el('p', 'more-note', 'Comments that are not tied to one definition.'));
        rows(sec, 'end:' + dm.id);
      }
    }
    var nav = el('div', 'nav'), back = el('button', 'btn', 'Back'), next = el('button', 'btn go', 'Next page'); back.type = next.type = 'button';
    back.style.visibility = index === 0 ? 'hidden' : ''; next.hidden = index === DATA.pages.length - 1;
    back.addEventListener('click', function () { show(DATA.pages[index - 1].key); });
    next.addEventListener('click', function () { show(DATA.pages[index + 1].key); });
    nav.append(back, next); sec.append(nav);
    return sec;
  }

  function itemsOn(p) {
    var keys = p.dim ? ['dim:' + p.dim.id, 'pair:' + p.dim.id, 'end:' + p.dim.id].concat(p.dim.subs.map(function (s) { return 'sub:' + s.key; })) : ['page:' + p.key];
    return DATA.items.filter(function (it) { return it.at.some(function (a) { return keys.indexOf(a) !== -1; }); });
  }
  function pageName(p) {
    if (!p.dim) return p.key === 'survey' ? 'The survey' : 'The taxonomy as a whole';
    var dims = DATA.pages.filter(function (x) { return x.dim; });
    return 'Dimension ' + (dims.indexOf(p) + 1) + ' of ' + dims.length + ': ' + p.title;
  }

  function renderBar() {
    var p = DATA.pages.filter(function (x) { return x.key === state.page; })[0];
    var its = itemsOn(p), n = its.filter(answered).length;
    d.getElementById('where').textContent = pageName(p);
    var pill = d.getElementById('count');
    pill.textContent = n + ' of ' + its.length + ' on this page answered';
    pill.className = 'pill' + (n === its.length ? ' done' : '');
    var sel = d.getElementById('pagesel'); sel.textContent = '';
    DATA.pages.forEach(function (x) {
      var xi = itemsOn(x), o = el('option', null, x.title + '  ' + xi.filter(answered).length + '/' + xi.length); o.value = x.key; sel.append(o);
    });
    sel.value = state.page;
    var total = DATA.items.length, done = DATA.items.filter(answered).length;
    d.getElementById('overall-count').textContent = done + ' of ' + total + ' answered in all';
  }

  function show(key) {
    state.page = key; save();
    DATA.pages.forEach(function (p) { d.getElementById('page-' + p.key).hidden = p.key !== key; });
    renderBar();
    window.scrollTo(0, 0);
  }

  function start() {
    d.getElementById('app').hidden = false;
    var holder = d.getElementById('sections');
    DATA.pages.forEach(function (p, i) { holder.append(renderPage(p, i)); });
    d.getElementById('pagesel').addEventListener('change', function () { show(this.value); });
    show(DATA.pages.some(function (p) { return p.key === state.page; }) ? state.page : DATA.pages[0].key);
  }

  if (!TOKEN || !window.crypto || !crypto.subtle) { d.getElementById('nolink').hidden = false; return; }
  crypto.subtle.digest('SHA-256', new TextEncoder().encode(TOKEN)).then(function (buf) {
    myHash = Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    if (DATA.people.indexOf(myHash) === -1) { d.getElementById('nolink').hidden = false; return; }
    start();
  });
})();

</script>
</body>
